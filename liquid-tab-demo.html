<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Liquid Glass Tab Bar · 液态玻璃胶囊演示</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Segoe UI",sans-serif;
    background:radial-gradient(1200px 700px at 20% -10%,#2b3a67 0%,transparent 60%),
               radial-gradient(900px 600px at 85% 110%,#4a2b53 0%,transparent 55%),
               linear-gradient(160deg,#0b0e1d 0%,#131a33 55%,#0d1122 100%);
    color:#eef1fa;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:34px;overflow:hidden;user-select:none;-webkit-user-select:none;
    transition:background .8s;
  }
  body.light{
    background:radial-gradient(1100px 700px at 18% -10%,#dfe9ff 0%,transparent 60%),
               radial-gradient(900px 600px at 85% 110%,#ffe3ef 0%,transparent 55%),
               linear-gradient(160deg,#eef2fb 0%,#dfe6f5 100%);
    color:#1c2337;
  }
  .stage{display:flex;flex-direction:column;align-items:center;gap:26px}
  .title{font-size:15px;letter-spacing:.14em;opacity:.62;font-weight:500}
  .hint{font-size:12.5px;letter-spacing:.06em;opacity:.45;line-height:1.9;text-align:center}
  .hint b{font-weight:600;opacity:.9}

  /* ───────── 液态玻璃胶囊 ───────── */
  .pill{
    --iw:64px;   /* 单项宽度，由 JS 测量后回写，.tab 与 .ball 共享 */
    position:relative;display:flex;padding:7px;border-radius:999px;
    background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.07));
    backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);
    border:1px solid rgba(255,255,255,.20);
    box-shadow:0 22px 48px rgba(3,8,28,.42),
               0 2px 8px rgba(3,8,28,.24),
               inset 0 1.5px 0 rgba(255,255,255,.34),
               inset 0 -1px 0 rgba(255,255,255,.06);
    isolation:isolate;
  }
  body.light .pill{
    background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.34));
    border-color:rgba(255,255,255,.75);
    box-shadow:0 22px 44px rgba(70,90,140,.22),
               0 2px 8px rgba(70,90,140,.12),
               inset 0 1.5px 0 rgba(255,255,255,.95),
               inset 0 -1px 0 rgba(255,255,255,.35);
  }
  /* 顶部弧面反光，让玻璃更“厚” */
  .pill::before{
    content:'';position:absolute;left:22px;right:22px;top:2px;height:34%;
    border-radius:999px;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.30),rgba(255,255,255,0));
  }

  /* ───────── 悬浮玻璃球（唯一动的元素）───────── */
  .ball{
    position:absolute;top:6px;bottom:6px;left:0;width:var(--iw);z-index:0;
    border-radius:999px;pointer-events:none;
    transform:translateX(var(--x)) scale(var(--bs,1));
    transition:transform .62s cubic-bezier(.26,1.7,.3,.96);  /* 弹性更大、更顺 */
    background:
      radial-gradient(120% 130% at 28% 12%,rgba(255,255,255,.62) 0%,rgba(255,255,255,.16) 42%,rgba(255,255,255,.05) 100%),
      linear-gradient(180deg,rgba(140,170,255,.34),rgba(120,140,255,.14));
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),
               inset 0 -2px 6px rgba(255,255,255,.12),
               0 6px 18px rgba(96,132,255,.30),
               0 1px 4px rgba(20,40,120,.18);
    border:1px solid rgba(255,255,255,.34);
    will-change:transform;
  }
  body.light .ball{
    background:
      radial-gradient(120% 130% at 28% 12%,rgba(255,255,255,.95) 0%,rgba(255,255,255,.4) 45%,rgba(255,255,255,.14) 100%),
      linear-gradient(180deg,rgba(160,190,255,.5),rgba(150,170,255,.2));
    box-shadow:inset 0 1.5px 0 #fff,
               0 6px 16px rgba(90,120,230,.28),
               0 1px 3px rgba(60,80,160,.15);
    border-color:rgba(255,255,255,.9);
  }
  .ball.moving{--bs:1.12}                 /* 滑动到位：对当前页轻微放大包裹 */
  .ball.drag{                             /* 拖动：关过渡跟手 + 放大到溢出边框 + 阴影提起 */
    --bs:1.30;transition:none;
    border-color:rgba(255,255,255,.6);
    background:
      radial-gradient(120% 130% at 28% 12%,rgba(255,255,255,.78) 0%,rgba(255,255,255,.26) 42%,rgba(255,255,255,.08) 100%),
      linear-gradient(180deg,rgba(150,178,255,.44),rgba(120,140,255,.18));
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.7),
               inset 0 -2px 6px rgba(255,255,255,.16),
               0 14px 34px rgba(60,90,220,.42),
               0 3px 10px rgba(20,40,120,.22);
  }
  body.light .ball.drag{
    box-shadow:inset 0 1.5px 0 #fff,
               0 14px 30px rgba(90,120,230,.36),
               0 3px 10px rgba(60,80,160,.18);
  }
  .ball.long{--bs:1.34}                   /* 长按：膨胀更明显 */

  /* ───────── tab 项（全程不动；图标在球到达时果冻变形 + 变色）───────── */
  .tabs{position:relative;z-index:1;display:flex}
  .pill{--on:#AFCBFF}                     /* 选中色：可被用户自定义覆盖 */
  body.light .pill{--on:#2F51D8}
  .tab{
    width:var(--iw);height:58px;border:none;background:none;color:inherit;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    cursor:pointer;position:relative;
    -webkit-user-drag:none;touch-action:none;
  }
  .tab .ic{display:flex;transform:scale(1);transition:transform .34s cubic-bezier(.3,1.5,.5,1)}
  .tab .ic svg{width:23px;height:23px}
  .tab .lb{font-size:10.5px;letter-spacing:.05em;opacity:.55;transition:color .26s,opacity .26s}
  .tab{color:rgba(235,240,255,.78)}
  body.light .tab{color:rgba(40,52,84,.82)}
  /* 球移动到哪里，哪里就实时变色 + 图标果冻变形放大 */
  .tab.on{color:var(--on)}
  .tab.on .lb{opacity:1;font-weight:600}
  .tab.on .ic{transform:scale(1.14);animation:jelly .6s cubic-bezier(.3,1.4,.5,1)}
  @keyframes jelly{
    0%  {transform:scale(1)}
    30% {transform:scale(1.28,.8)}     /* 横向压扁 */
    58% {transform:scale(.86,1.2)}     /* 纵向拉长回弹 */
    80% {transform:scale(1.12,.96)}
    100%{transform:scale(1.14)}        /* 停在放大态 */
  }

  .bgToggle{
    position:fixed;top:22px;right:22px;border:1px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.09);backdrop-filter:blur(14px);color:inherit;
    font-size:12px;letter-spacing:.1em;padding:9px 16px;border-radius:999px;cursor:pointer;
  }
  body.light .bgToggle{border-color:rgba(60,80,140,.25);background:rgba(255,255,255,.5)}
  .bgToggle:active{transform:scale(.94)}
</style>
</head>
<body>
  <button class="bgToggle" id="colorBtn" style="right:130px">选中色 <span id="onDot" style="display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;background:#AFCBFF;box-shadow:0 0 6px rgba(255,255,255,.5)"></span></button>
  <input type="color" id="onColor" value="#afcbff" style="position:fixed;left:-100px;top:-100px;opacity:0;pointer-events:none" aria-hidden="true">
  <button class="bgToggle" id="bgToggle">切换浅色</button>
  <div class="stage">
    <div class="title">LIQUID GLASS TAB BAR</div>
    <div class="hint">
      <b>点按</b> 悬浮球弹性滑到位 · <b>长按</b> 悬浮球膨胀 · <b>按住左右拖</b> 球放大溢出边框跟手，松手弹回吸附
    </div>
    <div class="pill" id="pill">
      <div class="ball" id="ball"></div>
      <div class="tabs" id="tabs">
        <button class="tab" data-i="0">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.3 8.7 8.7 0 0 1-3.9-.9L3 20l1.2-5.4a8.1 8.1 0 0 1-.7-3.1A8.4 8.4 0 0 1 12 3.2a8.4 8.4 0 0 1 9 8.3z"/></svg></span>
          <span class="lb">聊天</span>
        </button>
        <button class="tab" data-i="1">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5S3.5 15.4 3.5 9.6A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8.5 2.6c0 5.8-8.5 10.9-8.5 10.9z"/></svg></span>
          <span class="lb">心潮</span>
        </button>
        <button class="tab" data-i="2">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4.5"/><path d="M8.5 12.2l2.4 2.4 4.6-5"/></svg></span>
          <span class="lb">待办</span>
        </button>
        <button class="tab" data-i="3">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.6"/><path d="M15.2 8.8l-1.8 4.6-4.6 1.8 1.8-4.6z"/></svg></span>
          <span class="lb">探索</span>
        </button>
        <button class="tab" data-i="4">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.6 12 4l8 6.6V20a.9.9 0 0 1-.9.9H14.8v-5.6H9.2v5.6H4.9A.9.9 0 0 1 4 20z"/></svg></span>
          <span class="lb">主页</span>
        </button>
      </div>
    </div>
  </div>
<script>
(function(){
  const pill  = document.getElementById('pill');
  const ball  = document.getElementById('ball');
  const tabs  = Array.from(document.querySelectorAll('.tab'));
  const N     = tabs.length;
  let idx     = 0;          /* 当前选中 */
  let iw      = 0;          /* 单项宽度 */
  let pad     = 7;          /* 胶囊内边距 */

  function measure(){
    iw = tabs[0].getBoundingClientRect().width;   /* 首次为 CSS 默认 64px */
    if(!iw || iw < 40) iw = 64;
    pill.style.setProperty('--iw', iw+'px');      /* 挂在胶囊上，.tab 与 .ball 共享 */
    setBall(idx);
  }
  function ballX(i){ return pad + i*iw; }
  let mvT=null;
  function setBall(i){
    ball.classList.remove('drag','long');
    ball.classList.add('moving');                 /* 滑动途中球轻微放大包裹当前页 */
    ball.style.setProperty('--x', ballX(i)+'px');
    clearTimeout(mvT);
    mvT=setTimeout(()=>ball.classList.remove('moving'), 620);
  }
  function setActive(i){
    idx = i;   /* on 类完全交给 trackLoop 按球的实时位置管理 */
  }

  /* ── 实时变色：球移动到哪里，哪个 tab 就变色（rAF 读取球的实时位置）── */
  let liveIdx = idx;
  (function trackLoop(){
    try{
      const m = new DOMMatrixReadOnly(getComputedStyle(ball).transform);
      let k = Math.round((m.e - pad) / iw);
      k = Math.max(0, Math.min(N-1, k));
      if(k !== liveIdx){
        liveIdx = k;
        tabs.forEach((t,i)=>t.classList.toggle('on', i===k));
      }
    }catch(err){}
    requestAnimationFrame(trackLoop);
  })();

  /* ── 交互：点按 / 长按 / 拖动 ── */
  let pressTimer=null, longFired=false, dragging=false, startPX=0, curI=0;
  const LONG_MS=430;

  function onDown(e){
    const tab = e.target.closest('.tab'); if(!tab) return;
    e.preventDefault();
    curI = +tab.dataset.i;
    longFired = false; dragging = false;
    startPX = e.clientX;
    pressTimer = setTimeout(()=>{
      longFired = true;
      ball.classList.add('long');            /* 长按：悬浮球膨胀 */
      if(navigator.vibrate) try{navigator.vibrate(12)}catch(err){}
    }, LONG_MS);
    try{ pill.setPointerCapture(e.pointerId); }catch(err){}   /* 拖出胶囊也能继续跟手 */
  }
  function onMove(e){
    if(curI<0) return;
    const dx = e.clientX - startPX;
    if(!dragging && Math.abs(dx)>7){          /* 超过阈值 → 进入拖动 */
      dragging = true;
      clearTimeout(pressTimer);
      ball.classList.remove('moving');
      ball.classList.add('drag');             /* 跟手 + 放大溢出边框 */
    }
    if(dragging){
      let x = ballX(curI) + dx;
      const minX = pad, maxX = pad + (N-1)*iw;
      x = Math.max(minX, Math.min(maxX, x));
      ball.style.setProperty('--x', x+'px');
    }
  }
  function onUp(e){
    if(curI<0) return;
    clearTimeout(pressTimer);
    if(dragging){
      /* 松手：球弹回原尺寸并吸附最近项 */
      const rect = pill.getBoundingClientRect();
      const center = e.clientX - rect.left;
      let best = 0, bd = 1e9;
      for(let k=0;k<N;k++){ const d=Math.abs(pad+k*iw+iw/2-center); if(d<bd){bd=d;best=k;} }
      setBall(best);
      if(best!==idx) setActive(best);
    }else{
      setBall(curI);                          /* 点按/长按松手：球弹性滑到位 */
      setActive(curI);
    }
    curI = -1; dragging = false; longFired = false;
  }
  function onCancel(){
    clearTimeout(pressTimer);
    setBall(idx);
    curI=-1; dragging=false; longFired=false;
  }

  pill.addEventListener('pointerdown', onDown);
  pill.addEventListener('pointermove', onMove);
  pill.addEventListener('pointerup', onUp);
  pill.addEventListener('pointercancel', onCancel);
  pill.addEventListener('lostpointercapture', onCancel);

  document.getElementById('bgToggle').addEventListener('click', ()=>{
    document.body.classList.toggle('light');
    document.getElementById('bgToggle').textContent =
      document.body.classList.contains('light') ? '切换深色' : '切换浅色';
  });

  window.addEventListener('resize', measure);
  measure();
  setActive(0);
  setBall(0);

  /* ── 自定义选中颜色（用户自选，存 localStorage）── */
  const onColor = document.getElementById('onColor');
  const onDot   = document.getElementById('onDot');
  const colorBtn = document.getElementById('colorBtn');
  let savedColor = null;
  try{ savedColor = localStorage.getItem('ltb-on-color'); }catch(err){}
  if(savedColor && /^#[0-9a-fA-F]{6}$/.test(savedColor)){
    onColor.value = savedColor;
    pill.style.setProperty('--on', savedColor);
    onDot.style.background = savedColor;
  }
  colorBtn.addEventListener('click', ()=>onColor.click());
  onColor.addEventListener('input', ()=>{
    const c = onColor.value;
    pill.style.setProperty('--on', c);
    onDot.style.background = c;
    try{ localStorage.setItem('ltb-on-color', c); }catch(err){}
  });
})();
</script>
</body>
</html>
