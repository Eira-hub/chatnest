<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF1F7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="sky-snow-icon-180.png">
<title>ChatNest · 星夜小筑</title>
<style>
:root{
  --fs:15px;
  --bg0:#EEF1F7;--bg1:#F3F5FA;--bg2:#E7EBF3;
  --panel:rgba(255,255,255,.74);--panel2:rgba(30,40,80,.05);--panel3:rgba(30,40,80,.09);
  --panel-solid:#F6F8FC;--panel-top:rgba(255,255,255,.66);
  --line:rgba(30,40,80,.12);--line2:rgba(30,40,80,.19);
  --text:#16181D;--text2:#565C6E;--text3:#8A90A2;
  --accent:#7C8BC9;--accent2:#4A57A5;--moon:#9C7B46;--danger:#C05656;
  --user-b1:#F2EDE7;--user-b2:#E7E0D8;--user-fg:#1B1C22;--user-line:rgba(120,100,70,.22);--ai-b:rgba(255,255,255,.66);--ai-line:rgba(30,40,80,.14);
  --r-bubble:16px;--r-panel:16px;--r-full:999px;
  --sans:-apple-system,system-ui,'PingFang SC','HarmonyOS Sans SC',sans-serif;
  --serif:Georgia,'Songti SC','STSong','Noto Serif SC',serif;
  --shadow:0 8px 28px rgba(40,60,120,.13);
  --ease:cubic-bezier(.22,.8,.3,1);
}
[data-theme="dark"]{
  --bg0:#050508;--bg1:#08090F;--bg2:#0D0F18;
  --panel:rgba(18,24,48,.78);--panel2:rgba(255,255,255,.05);--panel3:rgba(255,255,255,.08);
  --panel-solid:#111731;--panel-top:rgba(10,15,32,.6);
  --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
  --text:#E9EBF4;--text2:#9BA1B8;--text3:#626A85;
  --accent:#A5B9DC;--accent2:#CBD8EF;--moon:#E3C89E;--danger:#D97A7A;
  --user-b1:#F2EDE7;--user-b2:#E7E0D8;--user-fg:#1B1C22;--user-line:rgba(255,255,255,.28);--ai-b:rgba(12,13,18,.42);--ai-line:rgba(255,255,255,.22);
  --shadow:0 8px 28px rgba(0,0,0,.38);
}
  --r-bubble:16px;--r-panel:16px;--r-full:999px;
  --sans:-apple-system,system-ui,'PingFang SC','HarmonyOS Sans SC',sans-serif;
  --serif:Georgia,'Songti SC','STSong','Noto Serif SC',serif;
  --shadow:0 8px 28px rgba(0,0,0,.38);
  --ease:cubic-bezier(.22,.8,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100dvh;overflow:hidden;background:var(--bg0)}
body{font-family:var(--sans);color:var(--text);font-size:var(--fs);line-height:1.65}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input,textarea{font-family:inherit;color:inherit;border:none;outline:none;background:none}
.hidden{display:none!important}
svg{display:block}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:4px}

/* ───────── 星空 ───────── */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(120% 90% at 78% -10%,#1A2344 0%,transparent 55%),
             radial-gradient(90% 70% at 12% 108%,#141C38 0%,transparent 52%),
             linear-gradient(180deg,var(--bg1),var(--bg0))}
.stars,.stars::after{position:absolute;inset:0}
.stars{background-image:
  radial-gradient(1.5px 1.5px at 12% 18%,rgba(255,255,255,.75) 50%,transparent 51%),
  radial-gradient(1px 1px at 28% 64%,rgba(255,255,255,.45) 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 44% 32%,rgba(255,255,255,.6) 50%,transparent 51%),
  radial-gradient(1px 1px at 58% 78%,rgba(255,255,255,.4) 50%,transparent 51%),
  radial-gradient(2px 2px at 71% 22%,rgba(255,255,255,.7) 50%,transparent 51%),
  radial-gradient(1px 1px at 83% 55%,rgba(255,255,255,.5) 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 91% 84%,rgba(255,255,255,.55) 50%,transparent 51%),
  radial-gradient(1px 1px at 8% 86%,rgba(255,255,255,.42) 50%,transparent 51%),
  radial-gradient(1.2px 1.2px at 36% 92%,rgba(255,255,255,.45) 50%,transparent 51%),
  radial-gradient(1px 1px at 64% 8%,rgba(255,255,255,.5) 50%,transparent 51%),
  radial-gradient(1.3px 1.3px at 20% 42%,rgba(227,200,158,.6) 50%,transparent 51%),
  radial-gradient(1px 1px at 77% 68%,rgba(227,200,158,.5) 50%,transparent 51%);
  animation:twinkle 7s ease-in-out infinite alternate}
[data-theme="light"] .sky{background:radial-gradient(120% 90% at 78% -10%,#DCE4F4 0%,transparent 55%),radial-gradient(90% 70% at 12% 108%,#E3E8F5 0%,transparent 52%),linear-gradient(180deg,#F3F5FA,#E9EDF6)}
[data-theme="light"] .stars{opacity:.45;filter:brightness(.65) saturate(.65)}
[data-theme="light"]::-webkit-scrollbar-thumb{background:rgba(30,40,80,.22)}
.stars::after{background-image:
  radial-gradient(1px 1px at 15% 30%,rgba(255,255,255,.35) 50%,transparent 51%),
  radial-gradient(1.4px 1.4px at 52% 14%,rgba(255,255,255,.4) 50%,transparent 51%),
  radial-gradient(1px 1px at 68% 45%,rgba(255,255,255,.3) 50%,transparent 51%),
  radial-gradient(1.6px 1.6px at 87% 32%,rgba(255,255,255,.45) 50%,transparent 51%),
  radial-gradient(1px 1px at 40% 74%,rgba(255,255,255,.32) 50%,transparent 51%),
  radial-gradient(1.2px 1.2px at 95% 12%,rgba(255,255,255,.38) 50%,transparent 51%);
  animation:twinkle 9s ease-in-out infinite alternate-reverse}
@keyframes twinkle{from{opacity:.55}to{opacity:1}}

/* ───────── gate 登录门 ───────── */
#gate{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px}
.orion{width:150px;height:70px;margin-bottom:26px;opacity:.95}
.orion .belt{stroke:rgba(165,185,220,.28);stroke-width:1;stroke-dasharray:3 5}
.orion .s{fill:#DFE7F5}
.orion .s1,.orion .s3{animation:glow 3.2s ease-in-out infinite}
.orion .s2{fill:var(--moon);animation:glow 3.2s ease-in-out .8s infinite}
@keyframes glow{0%,100%{opacity:.6}50%{opacity:1}}
.gate-title{font-family:var(--serif);font-size:30px;letter-spacing:.12em;font-weight:500}
.gate-sub{margin-top:10px;font-size:13px;color:var(--text2);letter-spacing:.28em}
.gate-form{margin-top:44px;width:min(320px,84vw);display:flex;flex-direction:column;gap:14px}
.gate-input{height:48px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);
  padding:0 18px;font-size:15px;text-align:center;letter-spacing:.2em;transition:border-color .2s}
.gate-input:focus{border-color:rgba(165,185,220,.5)}
.gate-input::placeholder{color:var(--text3);letter-spacing:.2em}
.gate-btn{height:48px;border-radius:14px;background:linear-gradient(135deg,#3A4769,#2B3450);
  border:1px solid rgba(165,185,220,.28);color:var(--accent2);font-size:15px;letter-spacing:.3em;text-indent:.3em;
  transition:transform .15s var(--ease),filter .2s}
.gate-btn:active{transform:scale(.97)}
.gate-error{height:18px;margin-top:2px;font-size:12px;color:var(--danger);text-align:center;opacity:0;transition:opacity .25s}
.gate-error.on{opacity:1}

/* ───────── 主框架 ───────── */
#app{position:fixed;inset:0;z-index:1;display:flex;height:100dvh;overflow:hidden}
#main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;z-index:1}

/* ───────── 侧栏 ───────── */
#sidebar{width:min(78vw,300px);flex-shrink:0;background:var(--panel);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:3}
.sb-head{padding:calc(env(safe-area-inset-top) + 18px) 16px 12px}
.sb-brand{display:flex;align-items:center;gap:8px;padding:0 4px 14px}
.sb-brand .dot{width:7px;height:7px;border-radius:50%;background:var(--moon);box-shadow:0 0 8px rgba(227,200,158,.8)}
.sb-brand span{font-family:var(--serif);font-size:15px;letter-spacing:.14em;color:var(--text2)}
.btn-new{width:100%;height:44px;border-radius:13px;background:var(--panel3);border:1px solid rgba(165,185,220,.22);
  color:var(--accent2);font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .15s var(--ease),background .2s}
.btn-new:active{transform:scale(.97);background:rgba(255,255,255,.11)}
#sbList{flex:1;overflow-y:auto;padding:6px 10px 10px;min-height:0}
.sb-date{padding:12px 8px 4px;font-size:11px;color:var(--text3);letter-spacing:.18em}
.sb-item{position:relative;border-radius:12px;padding:10px 12px;margin-bottom:2px;display:flex;align-items:center;gap:8px;
  cursor:pointer;transition:background .15s}
.sb-item:active{background:var(--panel2)}
.sb-item.on{background:var(--panel3)}
.sb-item .t{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item .time{font-size:11px;color:var(--text3);flex-shrink:0}
.sb-item .starred{color:var(--moon);flex-shrink:0}
.sb-item .ops{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:none;gap:2px;
  background:linear-gradient(90deg,transparent,rgba(18,24,48,.95) 22%);padding-left:18px}
.sb-item .ops button{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--text2)}
.sb-item .ops button:active{background:rgba(255,255,255,.1)}
.sb-item .ops .del:active{color:var(--danger)}
.sb-item:hover .ops,.sb-item.on .ops{display:flex}
.sb-item:active .ops{display:flex}
.sb-foot{padding:10px 16px calc(env(safe-area-inset-bottom) + 14px);border-top:1px solid var(--line);display:flex;gap:8px}
.sb-foot button{flex:1;height:38px;border-radius:11px;font-size:13px;color:var(--text2);display:flex;align-items:center;justify-content:center;gap:6px}
.sb-foot button:active{background:var(--panel2);color:var(--text)}
#scrim{position:fixed;inset:0;z-index:2;background:rgba(4,7,16,.55);opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.on{opacity:1;pointer-events:auto}

/* ───────── 顶栏 ───────── */
#topbar{flex-shrink:0;height:calc(env(safe-area-inset-top) + 54px);padding:env(safe-area-inset-top) 12px 0;
  display:flex;align-items:center;gap:6px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  background:var(--panel-top);border-bottom:1px solid var(--line);z-index:2;transition:background .3s,backdrop-filter .3s}
body.fs #topbar{position:absolute;left:0;right:0;top:0;z-index:6;background:linear-gradient(180deg,rgba(5,5,8,.78),rgba(5,5,8,0));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:none}
.tb-btn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--text2);
  transition:background .15s,color .15s;flex-shrink:0}
.tb-btn:active{background:var(--panel3);color:var(--text)}
#btnModel{height:32px;padding:0 12px;border-radius:var(--r-full);border:1px solid var(--line);display:flex;align-items:center;gap:5px;
  font-size:12.5px;color:var(--text2);max-width:46vw;flex-shrink:0}
#btnModel span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#convTitle{flex:1;min-width:0;text-align:center;font-size:14px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--serif);letter-spacing:.04em}
.tb-right{width:40px;flex-shrink:0}

/* ───────── 消息流 ───────── */
#stream{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 14px 8px;min-height:0;scroll-behavior:auto}
.stream-inner{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.load-more{align-self:center;font-size:12px;color:var(--text3);padding:6px 16px;border-radius:var(--r-full);border:1px solid var(--line)}
.load-more:active{color:var(--text2)}
#splash{max-width:720px;margin:0 auto;padding:9vh 10px 20px;text-align:center}
#splash .s1{font-family:var(--serif);font-size:21px;letter-spacing:.06em;color:var(--text)}
#splash .s2{margin-top:12px;font-size:13px;color:var(--text2);line-height:2}
#splash .orb{width:46px;height:46px;margin:0 auto 20px;border-radius:50%;
  background:radial-gradient(circle at 34% 32%,#F3E7CD,#D9BC8C 58%,#A98F63);
  box-shadow:0 0 26px rgba(227,200,158,.35),0 0 60px rgba(227,200,158,.12)}

.msg{display:flex;gap:8px;max-width:100%;animation:rise .3s var(--ease)}
.msg.cont{margin-top:-10px}
.msg.cont .avatar{visibility:hidden}
.msg .col{display:flex;flex-direction:column;max-width:84%;min-width:0}
.msg .mtime{font-size:10px;color:var(--text3);margin-top:3px;letter-spacing:.03em}
.msg.user .mtime{text-align:right}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.msg.user{flex-direction:row-reverse}
.avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;margin-top:2px;overflow:hidden;
  background:radial-gradient(circle at 36% 32%,#F3E7CD,#C7A878 62%,#8F7448);display:flex;align-items:center;justify-content:center}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar svg{width:16px;height:16px;color:rgba(10,14,30,.75)}
.avatar.me-def{background:linear-gradient(135deg,#8B9CD0,#56679F)}
.av-edit{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;color:var(--text2);cursor:pointer}
.av-edit .avatar{width:54px;height:54px;box-shadow:0 0 0 2px rgba(165,185,220,.35)}
.bubble{max-width:100%;padding:7px 12px;border-radius:var(--r-bubble);font-size:var(--fs);word-break:break-word;overflow-wrap:anywhere}
.msg.user{margin-left:auto}
.msg.user .bubble{background:linear-gradient(135deg,var(--user-b1),var(--user-b2));color:var(--user-fg);border:1px solid var(--user-line);border-top-right-radius:var(--r-bubble);box-shadow:0 2px 10px rgba(0,0,0,.22)}
.msg.ai .bubble{background:var(--ai-b);border:1px solid var(--ai-line);border-top-left-radius:var(--r-bubble)}
.bubble .body a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.bubble .body h1,.bubble .body h2,.bubble .body h3{font-family:var(--serif);font-weight:500;margin:10px 0 4px;font-size:16.5px}
.bubble .body p{margin:0}
.bubble .body code{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:.88em;background:rgba(255,255,255,.09);padding:1px 6px;border-radius:6px}
.voicebar{display:flex;align-items:center;gap:8px;margin-top:6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line);cursor:pointer;user-select:none;-webkit-user-select:none;max-width:200px;transition:background .15s}
.voicebar:active{background:rgba(255,255,255,.14)}
.voicebar .vp{width:0;height:0;border-left:11px solid var(--accent);border-top:7px solid transparent;border-bottom:7px solid transparent;flex:none;transition:all .15s}
.voicebar.playing .vp{width:11px;height:14px;border:none;border-left:4px solid var(--accent);border-right:4px solid var(--accent)}
.voicebar .waves{flex:1;display:flex;align-items:center;justify-content:center;gap:2.5px;height:15px}
.voicebar .waves i{display:block;width:2.5px;border-radius:2px;background:var(--accent);opacity:.6;transform-origin:center}
.voicebar.playing .waves i{animation:wv .7s ease-in-out infinite alternate}
.voicebar.playing .waves i:nth-child(2n){animation-delay:.18s}
.voicebar.playing .waves i:nth-child(3n){animation-delay:.33s}
@keyframes wv{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
.voicebar .vt{font-size:11px;color:var(--text3);flex:none;letter-spacing:.5px}
.pre{background:rgba(4,7,16,.65);border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden}
.pre .lang{font-size:11px;color:var(--text3);padding:6px 12px 0;letter-spacing:.12em}
.pre code{display:block;padding:10px 12px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:13px;line-height:1.6;overflow-x:auto;white-space:pre}
.think{margin-bottom:8px;border-left:2px solid rgba(165,185,220,.3);padding-left:10px}
.think summary{font-size:12px;color:var(--text3);cursor:pointer;letter-spacing:.08em;list-style:none}
.think summary::-webkit-details-marker{display:none}
.think .tk-body{font-size:13px;color:var(--text2);margin-top:6px;white-space:pre-wrap;max-height:180px;overflow-y:auto}
.typing{display:inline-flex;gap:4px;align-items:center;height:20px}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--text3);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.msg-err{margin-top:6px;font-size:13px;color:var(--danger)}

/* ───────── composer v21 · 大圆角磨砂玻璃 ───────── */
.composer{flex-shrink:0;padding:8px 20px calc(env(safe-area-inset-bottom) + 10px);position:relative;z-index:2}
.composer-row{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:8px}
.glass-input{flex:1;min-width:0;display:flex;align-items:center;gap:2px;
  background:linear-gradient(135deg,rgba(255,255,255,.66),rgba(255,255,255,.34));
  backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);
  border:1px solid rgba(255,255,255,.68);border-radius:24px;padding:5px 5px 5px 7px;
  box-shadow:0 4px 18px rgba(40,60,120,.10),inset 0 1px 0 rgba(255,255,255,.75);
  transition:border-color .25s,box-shadow .25s;position:relative}
[data-theme="dark"] .glass-input{background:var(--panel);border-color:var(--line2)}
.glass-input:focus-within{border-color:rgba(120,140,220,.55);box-shadow:0 6px 22px rgba(70,90,180,.15),inset 0 1px 0 rgba(255,255,255,.8)}
.glass-input::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s;
  box-shadow:inset 0 0 26px rgba(217,122,122,.16)}
.glass-input.rec-on::after{opacity:1}
#input{flex:1;min-width:0;display:block;resize:none;font-size:var(--fs);line-height:1.5;height:1.55em;overflow-y:auto;padding:5px 2px;background:none}
#input::placeholder{color:var(--text3)}
.dock{position:relative;width:calc(100% - 4px);margin:8px auto 0;display:flex;align-items:center;
  background:linear-gradient(135deg,rgba(255,255,255,.38),rgba(255,255,255,.14));
  backdrop-filter:url(#lgLens) blur(1.1px) saturate(1.4);-webkit-backdrop-filter:url(#lgLens) blur(1.1px) saturate(1.4);
  border:1px solid rgba(255,255,255,.55);border-radius:999px;padding:3px;
  box-shadow:0 6px 22px rgba(40,60,120,.13)}
.dock::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 1.5px 1px rgba(255,255,255,.9),inset 0 -1.5px 1px rgba(255,255,255,.45),inset 1.5px 0 1px rgba(255,255,255,.35),inset -1.5px 0 1px rgba(255,255,255,.35),inset 0 0 16px rgba(255,255,255,.14)}
.dock::after{content:'';position:absolute;inset:1px;border-radius:inherit;pointer-events:none;
  background:linear-gradient(102deg,rgba(255,255,255,0) 34%,rgba(255,255,255,.38) 45%,rgba(255,255,255,.1) 52%,rgba(255,255,255,0) 62%)}
[data-theme="dark"] .dock{background:linear-gradient(135deg,rgba(56,60,80,.4),rgba(24,26,40,.28));backdrop-filter:url(#lgLens) blur(1.1px) saturate(1.4);-webkit-backdrop-filter:url(#lgLens) blur(1.1px) saturate(1.4);border-color:rgba(255,255,255,.14)}
[data-theme="dark"] .dock::before{box-shadow:inset 0 1.5px 1px rgba(255,255,255,.45),inset 0 -1.5px 1px rgba(255,255,255,.2),inset 1.5px 0 1px rgba(255,255,255,.14),inset -1.5px 0 1px rgba(255,255,255,.14),inset 0 0 16px rgba(255,255,255,.05)}
[data-theme="dark"] .dock::after{background:linear-gradient(102deg,rgba(255,255,255,0) 34%,rgba(255,255,255,.16) 45%,rgba(255,255,255,.04) 52%,rgba(255,255,255,0) 62%)}
@supports (-webkit-touch-callout:none){.dock{backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5)}}
.dock-btn{position:relative;z-index:1;flex:1;height:32px;border-radius:999px;font-family:var(--serif);font-size:.62em;letter-spacing:.03em;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  color:var(--text2);transition:background .2s,color .2s,transform .15s var(--ease)}
.dock-btn img{width:17px;height:17px;object-fit:contain;display:block}
.dock-btn.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 1px 5px rgba(40,60,120,.14)}
[data-theme="dark"] .dock-btn img{filter:invert(1) brightness(1.55)}
.dock-btn span{line-height:1}
.dock-btn:active{transform:scale(.93)}
.dock-btn.on{background:rgba(91,107,250,.15);color:var(--accent2);font-weight:600}
.orb-float{position:fixed;z-index:9999;width:44px;height:44px;border-radius:50%;right:14px;bottom:150px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75) 0%,rgba(255,255,255,.28) 24%,rgba(255,255,255,.03) 50%,rgba(205,215,240,.1) 72%,rgba(255,255,255,.4) 98%);
  backdrop-filter:none;-webkit-backdrop-filter:none;
  border:1px solid rgba(255,255,255,.6);transition:transform .2s var(--ease);
  box-shadow:0 6px 20px rgba(40,60,120,.18),inset 0 -8px 16px rgba(255,255,255,.45),inset 0 5px 12px rgba(255,255,255,.6),0 0 16px rgba(150,170,255,.22)}
.orb-float::before{content:'';position:absolute;inset:-2px;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 200deg,rgba(255,160,160,.16),rgba(255,235,160,.16),rgba(160,255,190,.15),rgba(160,205,255,.2),rgba(205,160,255,.16),rgba(255,160,160,.16));
  -webkit-mask:radial-gradient(circle,transparent 60%,#000 68%,#000 100%);mask:radial-gradient(circle,transparent 60%,#000 68%,#000 100%)}
.orb-float::after{content:'';position:absolute;left:20%;top:13%;width:36%;height:24%;border-radius:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.06));filter:blur(1px)}
.orb-float.dragging{transition:none;cursor:grabbing}
.orb-float.pulse{animation:orbPulse .52s var(--ease)}
@keyframes orbPulse{0%{transform:scale(1)}42%{transform:scale(1.2)}100%{transform:scale(1)}}
.orb-lens{position:absolute;inset:0;border-radius:50%;overflow:hidden;pointer-events:none;opacity:1}
.orb-lens-inner{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
.orb-lens-inner *{transition:none!important;animation:none!important}
.orb-lens-inner .dock{box-shadow:none;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.orb-float.over-dock{background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.8) 0%,rgba(255,255,255,.25) 26%,rgba(255,255,255,.02) 52%,rgba(205,215,240,.08) 72%,rgba(255,255,255,.38) 98%);backdrop-filter:none;-webkit-backdrop-filter:none}
[data-theme="dark"] .orb-float{border-color:rgba(255,255,255,.28);box-shadow:0 6px 20px rgba(0,0,0,.45),inset 0 -8px 16px rgba(255,255,255,.25),inset 0 5px 12px rgba(255,255,255,.38),0 0 16px rgba(120,140,220,.3)}
.c-row{display:none}
.c-spacer{display:none}
.c-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text2);
  flex-shrink:0;transition:color .2s,background .2s,transform .15s var(--ease)}
.c-btn:active{transform:scale(.9);background:var(--panel3)}
.c-ico{display:flex;align-items:center;justify-content:center}
.seg{display:flex;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-full);padding:2px;margin:0 2px;flex-shrink:0}
.seg-btn{height:26px;padding:0 14px;border-radius:var(--r-full);font-size:12.5px;color:var(--text3);letter-spacing:.02em;
  transition:background .2s,color .2s,transform .15s var(--ease)}
.seg-btn:active{transform:scale(.94)}
.seg-btn.on{background:var(--user-b1);color:var(--user-fg)}
.btn-send{width:35px;height:35px;border-radius:50%;background:transparent;color:var(--accent2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s var(--ease),opacity .2s}
.btn-send:active{transform:scale(.88)}
.btn-send:disabled{opacity:.32}
.btn-send.stop{background:rgba(192,86,86,.18);color:var(--danger)}

/* ───────── sheets ───────── */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel-solid);border:1px solid var(--line);border-bottom:none;
  border-radius:22px 22px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);
  transform:translateY(105%);transition:transform .32s var(--ease);max-height:72vh;overflow-y:auto}
.sheet.on{transform:none}
.sheet .grip{width:38px;height:4px;border-radius:4px;background:rgba(255,255,255,.16);margin:4px auto 14px}
.sheet h3{font-family:var(--serif);font-size:15px;font-weight:500;letter-spacing:.1em;color:var(--text2);margin-bottom:12px;text-align:center}
.m-item{width:100%;display:flex;flex-direction:column;gap:2px;text-align:left;padding:13px 14px;border-radius:13px;margin-bottom:6px;border:1px solid transparent;transition:background .15s}
.m-item:active,.m-item.on{background:var(--panel3);border-color:rgba(165,185,220,.2)}
.m-item .mt{font-size:14.5px}
.m-item.on .mt{color:var(--accent2)}
.m-item .md{font-size:12px;color:var(--text3)}
.set-block{margin-bottom:16px}
.set-label{font-size:12px;color:var(--text3);letter-spacing:.15em;margin-bottom:8px}
.set-area{width:100%;min-height:150px;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:12px;
  font-size:13.5px;line-height:1.7;resize:vertical;color:var(--text2)}
.set-btn{width:100%;height:42px;border-radius:12px;background:var(--panel3);border:1px solid rgba(165,185,220,.22);color:var(--accent2);font-size:14px}
.set-btn:active{transform:scale(.98)}
.set-btn.warn{color:var(--danger);border-color:rgba(217,122,122,.25);margin-top:12px}
.set-input{width:100%;height:40px;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:0 12px;font-size:13px;color:var(--text2);text-align:left;letter-spacing:normal;transition:border-color .2s}
.set-input:focus{border-color:rgba(165,185,220,.5)}
.set-input::placeholder{color:var(--text3);letter-spacing:normal}

/* ───────── toast ───────── */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 66px);transform:translate(-50%,-8px);z-index:9;
  background:rgba(18,24,48,.94);border:1px solid var(--line2);color:var(--text);font-size:13px;
  padding:9px 18px;border-radius:var(--r-full);opacity:0;pointer-events:none;transition:all .28s var(--ease);max-width:80vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* 桌面宽屏 */
@media (min-width:820px){
  #sidebar{position:relative;left:0!important;transform:none!important;box-shadow:none}
  #scrim{display:none}
  #btnMenu{display:none}
  .sb-item .ops{display:none}
  .sb-item:hover .ops{display:flex}
}
/* 移动端侧栏抽屉 */
@media (max-width:819px){
  #sidebar{position:fixed;top:0;bottom:0;left:0;transform:translateX(-102%);transition:transform .3s var(--ease)}
  #sidebar.open{transform:none;box-shadow:24px 0 60px rgba(0,0,0,.45)}
}
/* ───────── 壁纸 & 全屏 v14 ───────── */
#wallpaper{position:fixed;inset:0;z-index:0;pointer-events:none;background-size:cover;background-position:center;opacity:0;transition:opacity .45s var(--ease)}
#wallpaper.on{opacity:1}
#wallpaper .dim{position:absolute;inset:0;background:#02040A;opacity:0;transition:opacity .3s}
body.has-wall .sky{background:none}
body.has-wall .stars{opacity:.75}
.wall-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.wall-grid .sw{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 2px;border-radius:12px;border:1px solid transparent;transition:background .15s,border-color .2s}
.wall-grid .sw:active{background:var(--panel3)}
.wall-grid .sw.on{border-color:var(--accent);background:var(--panel3)}
.wall-grid .sw i{width:100%;aspect-ratio:1;border-radius:9px;background-size:cover;background-position:center;border:1px solid var(--line2);display:block}
.wall-grid .sw b{font-size:10.5px;font-weight:400;color:var(--text2);white-space:nowrap;overflow:hidden;max-width:100%}
.wall-row{display:flex;align-items:center;gap:10px;margin-top:10px}
.wall-row .wl-lab{font-size:12px;color:var(--text3);flex-shrink:0;letter-spacing:.1em}
.wall-row input[type=range]{flex:1;accent-color:#A5B9DC;height:22px}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-top:10px}
.palette i{display:block;aspect-ratio:1;border-radius:50%;border:1px solid var(--line2);cursor:pointer;transition:transform .15s}
.palette i:active{transform:scale(.9)}
.sub-lab{font-size:11.5px;color:var(--text3);letter-spacing:.08em;margin-top:14px}
.wall-row input[type=color]{width:46px;height:28px;border-radius:8px;background:var(--panel3);padding:0;border:1px solid var(--line2);cursor:pointer;flex-shrink:0}
.wall-row input[type=color]::-webkit-color-swatch-wrapper{padding:3px}
.wall-row input[type=color]::-webkit-color-swatch{border:none;border-radius:6px}
.tb-btn.on{color:var(--accent2);background:var(--panel3)}
</style>
</head>
<body>
<div class="sky"><div class="stars"></div></div>
<div id="wallpaper"><div class="dim"></div></div>

<!-- 登录门 -->

  <svg class="orion" viewBox="0 0 150 70">

<div id="toast"></div>
<script>
'use strict';
/* ═══════════ ChatNest v27 · 星夜小筑 ═══════════ */
const DEFAULT_API_BASE = 'https://chatnest-fgkngqpobv.cn-hangzhou.fcapp.run';
const LS = {token:'cn_token', model:'cn_model', conv:'cn_conv', apiBase:'chatnest_api_base', apiToken:'chatnest_api_token'};
const LS_SPLIT = 'chatnest_split_mode';           /* 长条/短条拆条模式，默认短 */
const SPLIT_MAX_LEN = 280;                        /* 长条模式：单个气泡最多这么多字，超了才拆 */
/* 后端地址/令牌：优先读接口设置（localStorage），没配置就用焊死的默认值（开箱即用） */
function getApiBase(){
  try{ const v = (localStorage.getItem(LS.apiBase) || '').trim(); if(v) return v.replace(/\/+$/, ''); }catch(e){}
  return DEFAULT_API_BASE;
}
function getApiToken(){
  try{ const v = (localStorage.getItem(LS.apiToken) || '').trim(); if(v) return v; }catch(e){}
  return state.token || '';
}
const $ = id => document.getElementById(id);
const state = {
  token: localStorage.getItem(LS.token) || '',
  convId: localStorage.getItem(LS.conv) || '',
  model: localStorage.getItem(LS.model) || '',
  models: [], sessions: [], avatars: {me:'', ai:''},
  streaming: false, abortCtl: null, splash: '',
};

function toast(msg, ms){
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.classList.remove('on'), ms||2400);
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function relTime(iso){
  if(!iso) return '';
  const d = new Date(iso); if(isNaN(d)) return '';
  const diff = (Date.now()-d.getTime())/1000;
  if(diff < 60) return '刚刚';
  if(diff < 3600) return Math.floor(diff/60)+'分钟';
  if(diff < 86400) return Math.floor(diff/3600)+'小时';
  if(diff < 604800) return Math.floor(diff/86400)+'天';
  return (d.getMonth()+1)+'/'+d.getDate();
}
/* 统一请求封装：所有后端请求都走这里（地址/token 自动取接口设置或默认值） */
async function apiFetch(path, opts){
  opts = opts || {};
  const headers = Object.assign({}, opts.headers || {});
  if(!opts.formData && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
  const tok = getApiToken();
  if(tok) headers['Authorization'] = 'Bearer ' + tok;
  let body;
  if(opts.formData) body = opts.formData;
  else if(opts.body !== undefined) body = (typeof opts.body === 'string') ? opts.body : JSON.stringify(opts.body);
  return fetch(getApiBase() + path, { method: opts.method || 'GET', headers, body, signal: opts.signal });
}
async function api(path, opts){
  const res = await apiFetch(path, opts);
  if(res.status === 401){ logout(); throw new Error('未登录'); }
  if(!res.ok){
    let msg = '请求失败 '+res.status;
    try{ const j = await res.json(); if(j.detail) msg = j.detail; }catch(e){}
    throw new Error(msg);
  }
  return res.json();
}
/* ───────── 登录门 ───────── */
function showGate(){ $('gate').classList.remove('hidden'); $('app').classList.add('hidden'); }
function showApp(){ $('gate').classList.add('hidden'); $('app').classList.remove('hidden'); }
function logout(){ localStorage.removeItem(LS.token); state.token=''; state.convId=''; localStorage.removeItem(LS.conv); showGate(); }

$('gateForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const pwd = $('gateInput').value;
  const err = $('gateError'); err.classList.remove('on');
  if(!pwd){ err.textContent='输入密码才能进屋'; err.classList.add('on'); return; }
  $('gateBtn').textContent = '…'; $('gateBtn').disabled = true;
  try{
    const r = await apiFetch('/api/auth',{method:'POST', body:{password:pwd}});
    if(!r.ok){ throw new Error(r.status===401 ? '密码不对，再想想' : '服务打盹了 '+r.status); }
    const j = await r.json();
    state.token = j.token; localStorage.setItem(LS.token, j.token);
    $('gateInput').value='';
    showApp(); boot();
  }catch(ex){
    err.textContent = ex.message || '连不上服务器'; err.classList.add('on');
  }finally{
    $('gateBtn').textContent = '进 入'; $('gateBtn').disabled = false;
  }
});

/* ───────── 启动 ───────── */
async function boot(){
  try{
    const [m, av] = await Promise.all([ api('/api/models'), api('/api/avatars').catch(()=>({me:{url:''},ai:{url:''}})) ]);
    state.models = m.models || [];
    state.avatars = av || {me:{url:''}, ai:{url:''}};
    if(!state.model || !state.models.find(x=>x.id===state.model)){
      const p = state.models.find(x=>x.primary) || state.models[0];
      state.model = p ? p.id : '';
    }
    renderModelLabel();
    try{ const s = await api('/api/splash'); state.splash = s.line||''; }catch(e){}
    await loadSessions();
    if(state.convId && state.sessions.find(s=>s.conv_id===state.convId)){
      await openConv(state.convId, {silent:true});
    }else{
      newConv();
    }
  }catch(e){
    toast(e.message||'启动失败');
  }
}

/* ───────── 会话 ───────── */
async function loadSessions(){
  try{
    const r = await api('/api/sessions');
    state.sessions = r.sessions || [];
    renderSidebar();
  }catch(e){ /* 静默 */ }
}
function renderSidebar(){
  const box = $('sbList'); box.innerHTML = '';
  const list = state.sessions.slice();
  list.sort((a,b)=> (b.starred?1:0)-(a.starred?1:0) || String(b.updated_at||'').localeCompare(String(a.updated_at||'')));
  if(!list.length){
    box.innerHTML = '<div class="sb-date" style="padding:18px 8px">还没有对话，点上面「新对话」开始</div>';
    return;
  }
  for(const s of list){
    const el = document.createElement('div');
    el.className = 'sb-item' + (s.conv_id===state.convId ? ' on':'');
    el.innerHTML =
      (s.starred ? '<svg class="starred" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.2 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg>' : '') +
      '<span class="t">'+esc(s.title||'新对话')+'</span>' +
      '<span class="time">'+esc(relTime(s.updated_at))+'</span>' +
      '<span class="ops">' +
        '<button class="ren" aria-label="重命名"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg></button>' +
        '<button class="del" aria-label="删除"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>' +
      '</span>';
    el.addEventListener('click', e=>{
      if(e.target.closest('.ops')) return;
      openConv(s.conv_id); closeSidebar();
    });
    el.querySelector('.ren').addEventListener('click', async ()=>{
      const t = prompt('重命名这段对话', s.title||'');
      if(t===null) return;
      try{ await api('/api/sessions/'+s.conv_id+'/title',{method:'PATCH',body:{title:t}}); s.title = t.trim()||'新对话'; renderSidebar(); if(s.conv_id===state.convId) $('convTitle').textContent = s.title; }catch(e){ toast(e.message); }
    });
    el.querySelector('.del').addEventListener('click', async e=>{
      e.stopPropagation();
      if(!confirm('删除「'+(s.title||'新对话')+'」？聊天记录会一起删掉')) return;
      try{
        await api('/api/sessions/'+s.conv_id,{method:'DELETE'});
        state.sessions = state.sessions.filter(x=>x.conv_id!==s.conv_id);
        if(s.conv_id===state.convId) newConv();
        renderSidebar();
        toast('已删除');
      }catch(ex){ toast(ex.message); }
    });
    box.appendChild(el);
  }
}
function newConv(){
  state.convId = '';
  localStorage.removeItem(LS.conv);
  $('convTitle').textContent = '';
  $('streamInner').innerHTML = '';
  const sp = $('splash');
  sp.classList.remove('hidden');
  $('splashLine').textContent = state.splash || '今晚月色不错';
  renderSidebar();
}
async function openConv(id, opt){
  opt = opt||{};
  state.convId = id;
  localStorage.setItem(LS.conv, id);
  const s = state.sessions.find(x=>x.conv_id===id);
  $('convTitle').textContent = s ? (s.title||'新对话') : '新对话';
  $('splash').classList.add('hidden');
  const inner = $('streamInner');
  inner.innerHTML = '';
  if(!opt.silent) renderSidebar();
  try{
    const r = await api('/api/sessions/'+id+'/messages?limit=40');
    const msgs = r.messages || [];
    if(r.has_more){
      const btn = document.createElement('button');
      btn.className = 'load-more'; btn.textContent = '查看更早';
      btn.addEventListener('click', ()=> loadEarlier(btn, id, r.next_before_id));
      inner.appendChild(btn);
    }
    for(const m of msgs) inner.appendChild(bubbleEl(m));
    scrollToBottom(true);
  }catch(e){
    toast(e.message||'历史加载失败');
  }
}
async function loadEarlier(btn, id, before){
  btn.textContent = '…';
  try{
    const r = await api('/api/sessions/'+id+'/messages?limit=40&before_id='+before);
    const inner = $('streamInner');
    const keep = document.createElement('div');
    inner.insertBefore(keep, btn);
    const frag = document.createDocumentFragment();
    for(const m of (r.messages||[])) frag.appendChild(bubbleEl(m));
    inner.insertBefore(frag, btn);
    keep.style.height = keep.previousElementSibling ? '0' : '0';
    if(!r.has_more){ btn.remove(); } else { btn.textContent='查看更早'; btn.dataset.before = r.next_before_id||''; btn.onclick=()=>loadEarlier(btn,id,r.next_before_id); }
  }catch(e){ btn.textContent='查看更早'; toast(e.message); }
}

/* ───────── 渲染消息 ───────── */
function md(src){
  let out = '';
  const parts = String(src).split(/```/);
  parts.forEach((p, i)=>{
    if(i % 2){
      const nl = p.indexOf('\n');
      const lang = nl > 0 ? p.slice(0, nl).trim() : '';
      const code = nl > 0 ? p.slice(nl+1) : p;
      out += '<div class="pre"><div class="lang">'+esc(lang||'code')+'</div><code>'+esc(code)+'</code></div>';
    }else{
      out += mdInline(p);
    }
  });
  return out;
}
function mdInline(p){
  const lines = String(p).split('\n');
  let html = '';
  let inList = false;
  for(const raw of lines){
    let line = esc(raw);
    line = line.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
               .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
               .replace(/`([^`\n]+)`/g,'<code>$1</code>')
               .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    const h = line.match(/^(#{1,3})\s+(.*)/);
    if(h){ if(inList){html+='</div>';inList=false;} html += '<h'+(h[1].length+1)+'>'+h[2]+'</h'+(h[1].length+1)+'>'; continue; }
    const li = line.match(/^\s*[-•]\s+(.*)/);
    if(li){ if(!inList){html+='<div style="padding-left:4px">';inList=true;} html += '<div>· '+li[1]+'</div>'; continue; }
    if(inList){ html += '</div>'; inList = false; }
    html += line ? '<p>'+line+'</p>' : '<p style="height:6px"></p>';
  }
  if(inList) html += '</div>';
  return html;
}
let curAudio=null, curBar=null, curSeq=0;
const WAVE_H=[5,9,13,7,11,6,12,8,5];
function makeVoiceBar(text){
  const bars = WAVE_H.map(h=>'<i style="height:'+h+'px"></i>').join('');
  return '<div class="voicebar" data-text="'+esc(text)+'"><span class="vp"></span><span class="waves">'+bars+'</span><span class="vt">听我说</span></div>';
}
async function playBar(bar, text){
  if(curAudio){ try{curAudio.pause();}catch(e){} if(curBar&&curBar!==bar) curBar.classList.remove('playing'); }
  curBar = bar; bar.classList.add('playing'); bar.querySelector('.vt').textContent='…';
  const mySeq = ++curSeq;
  try{
    const res = await apiFetch('/api/tts', {method:'POST', body:{text:text}});
    if(res.status===401){ logout(); return; }
    if(!res.ok){ let m='语音失败 '+res.status; try{const j=await res.json(); if(j.detail)m=j.detail;}catch(e2){} throw new Error(m); }
    if(mySeq!==curSeq) return;
    const blob = await res.blob();
    if(mySeq!==curSeq) return;
    const au = new Audio(URL.createObjectURL(blob));
    curAudio = au;
    au.addEventListener('loadedmetadata', ()=>{ if(curBar===bar&&isFinite(au.duration)) bar.querySelector('.vt').textContent=Math.round(au.duration)+'″'; });
    au.addEventListener('ended', ()=>{ if(curBar===bar){ bar.classList.remove('playing'); bar.querySelector('.vt').textContent='再听'; } });
    au.addEventListener('error', ()=>{ if(curBar===bar){ bar.classList.remove('playing'); bar.querySelector('.vt').textContent='听不了'; } });
    await au.play();
  }catch(e){
    if(mySeq===curSeq){ bar.classList.remove('playing'); bar.querySelector('.vt').textContent='听我说'; toast(e.message||'语音合成失败'); }
  }
}
document.addEventListener('click', function(e){
  const bar = e.target.closest('.voicebar'); if(!bar) return;
  e.preventDefault();
  const text = bar.dataset.text || '';
  if(curAudio && curBar===bar && !curAudio.paused){ curAudio.pause(); bar.classList.remove('playing'); bar.querySelector('.vt').textContent='暂停中'; return; }
  if(curAudio && curBar===bar && curAudio.readyState>0){ bar.classList.add('playing'); curAudio.play(); return; }
  playBar(bar, text);
});
function thinkOn(){ return localStorage.getItem(LS.think)!=='0'; }
function fmtClock(ts){ try{ const d=ts?new Date(ts):new Date(); if(isNaN(d.getTime())) return ''; return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }catch(e){ return ''; } }
function extractVoice(t){ if(/\[voice\]/i.test(t||'')) return (t||'').replace(/\[voice\]/ig,'').trim(); return null; }
const VHINT='\n\n[[sys:若此次适合用语音回复，在回复正文最末尾另起一行加上[voice]标记，不要解释]]';
const VHINT_RE=/\s*\[\[sys:[^\]]*\]\]\s*$/;
function splitAiText(raw){
  const t=(raw||'').trim();
  if(!t) return [];
  if(t.includes('```')||t.includes('[voice]')||t.includes('|')||/(^|\n)#{1,3}\s/.test(t)||t.includes('![')) return [t];
  if(splitMode()==='long'){
    if(t.length<=SPLIT_MAX_LEN) return [t];
    const seps='。！？!?…～~；;\n';
    const sents=[]; let cur='';
    for(const ch of t){ cur+=ch; if(seps.includes(ch)){ sents.push(cur); cur=''; } }
    if(cur) sents.push(cur);
    const chunks=[]; let acc='';
    for(const s0 of sents){
      const s=s0.trim(); if(!s) continue;
      if(s.length>SPLIT_MAX_LEN){
        if(acc){ chunks.push(acc); acc=''; }
        let rest=s;
        while(rest.length>SPLIT_MAX_LEN){
          let cut=rest.lastIndexOf(' ', SPLIT_MAX_LEN);
          if(cut < SPLIT_MAX_LEN*0.6) cut=SPLIT_MAX_LEN;
          chunks.push(rest.slice(0,cut).trim()); rest=rest.slice(cut).trim();
        }
        if(rest) acc=rest;
        continue;
      }
      if(acc && (acc+s).length>SPLIT_MAX_LEN){ chunks.push(acc); acc=s; }
      else acc+=s;
    }
    if(acc) chunks.push(acc);
    return chunks.length?chunks:[t];
  }
  const cjk=(t.match(/[\u4e00-\u9fff]/g)||[]).length;
  const isEn=cjk*2<t.length;
  const seps=isEn?'.。！？!?…～~；;\n':'。！？!?…～~；;\n';
  const lim=isEn?40:9, cap=isEn?46:26;
  const sents=[]; let cur='';
  for(const ch of t){ cur+=ch; if(seps.includes(ch)){ if(cur.trim()) sents.push(cur.trim()); cur=''; } }
  if(cur.trim()) sents.push(cur.trim());
  const junk=/^[.。,，、!！?？…～~;；\s]+$/;
  const frags=[];
  for(const s of sents){
    if(frags.length && junk.test(s)){ frags[frags.length-1]+=s; continue; }
    const parts=s.split(/\s+/).filter(Boolean);
    if(parts.length<=1){ if(s) frags.push(s); continue; }
    let acc='';
    for(const p of parts){
      if(acc && (acc+' '+p).length<=lim){ acc+=' '+p; }
      else { if(acc) frags.push(acc); acc=p; }
    }
    if(acc) frags.push(acc);
  }
  const res=[];
  for(const f of frags){
    if(f.length<=cap){ res.push(f); continue; }
    const sub=f.split(/[,，、]/).map(x=>x.trim()).filter(Boolean);
    let acc='';
    const joiner=isEn?' ':'，';
    for(const p of sub){
      if(acc && (acc+joiner+p).length<=cap){ acc+=joiner+p; }
      else { if(acc) res.push(acc); acc=p; }
    }
    if(acc) res.push(acc);
  }
  return res.length?res:[t];
}

function aiMsgNode(chunk, o){
  o=o||{};
  const el=document.createElement('div');
  el.className='msg ai'+(o.cont?' cont':'');
  let inner='';
  if(!o.cont && o.thinking && thinkOn()) inner+='<details class="think"><summary>他想了想 ▾</summary><div class="tk-body">'+esc(o.thinking)+'</div></details>';
  if(chunk) inner+='<div class="body">'+md(chunk)+'</div>';
  const av = o.cont ? '<div class="avatar"></div>' : '<div class="avatar">'+avatarSvg('ai')+'</div>';
  el.innerHTML = av+'<div class="col"><div class="bubble">'+inner+'</div>'+(o.mtime?'<div class="mtime">'+o.mtime+'</div>':'')+'</div>';
  el.dataset.mid=o.mid||'';
  return el;
}
function voiceMsgNode(text){
  const el=document.createElement('div');
  el.className='msg ai cont';
  el.innerHTML='<div class="avatar"></div><div class="col"><div class="bubble">'+makeVoiceBar(text)+'</div></div>';
  return el;
}
function bubbleEl(m){
  const isUser = m.role === 'user';
  const mt = fmtClock(m.created_at);
  if(isUser){
    const el=document.createElement('div');
    el.className='msg user';
    el.dataset.mid=m.id||'';
    const avOk = state.avatars && state.avatars.me && state.avatars.me.url;
    el.innerHTML = '<div class="avatar'+(avOk?'':' me-def')+'">'+avatarSvg('me')+'</div><div class="col"><div class="bubble"><div class="body">'+md((m.text||'').replace(VHINT_RE,''))+'</div></div>'+(mt?'<div class="mtime">'+mt+'</div>':'')+'</div>';
    return el;
  }
  const raw=(m.text||'').trim();
  const vText=extractVoice(raw);
  const bodyText=vText!==null?vText:raw;
  const chunks=splitAiText(bodyText);
  const frag=document.createDocumentFragment();
  chunks.forEach((c,i)=>{
    frag.appendChild(aiMsgNode(c,{cont:i>0, thinking:i===0?(m.thinking||''):'', mid:m.id||'', mtime:(i===chunks.length-1)?mt:''}));
  });
  if(vText) frag.appendChild(voiceMsgNode(vText));
  return frag;
}
function avatarSvg(role){

  if(av) return '<img src="'+av+'" alt="">';
  if(role === 'me'){
    return '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C13 8 16 11 22 12 16 13 13 16 12 22 11 16 8 13 2 12 8 11 11 8 12 2Z"/></svg>';

  else{ b.classList.remove('stop'); $('sendIcon').classList.remove('hidden'); $('stopIcon').classList.add('hidden'); b.disabled = !$('input').value.trim(); }

let avRole = '';
document.querySelectorAll('.av-edit').forEach(el => el.addEventListener('click', ()=>{ avRole = el.dataset.role; $('avFile').click(); }));
$('avFile').addEventListener('change', e=>{
  const f = e.target.files[0]; e.target.value = '';
  if(!f || !avRole) return;
  const r = new FileReader();
  r.onload = ()=>{
    const img = new Image();
    img.onload = async ()=>{
      const c = document.createElement('canvas'); c.width = c.height = 256;
      const g = c.getContext('2d');
      const sz = Math.min(img.width, img.height);
      g.drawImage(img, (img.width-sz)/2, (img.height-sz)/2, sz, sz, 0, 0, 256, 256);
      const dataUrl = c.toDataURL('image/jpeg', 0.85);
      try{
        await api('/api/avatars', {method:'PUT', body:{role:avRole, dataUrl:dataUrl}});
        state.avatars[avRole] = {url:dataUrl};
        refreshAvPreviews();
        toast('头像换好啦', 1500);
      }catch(err){ toast(err.message || '没保存上，再试一次', 2000); }
    };
    img.src = r.result;
  };
  r.readAsDataURL(f);
});

$('btnSend').addEventListener('click', ()=>{

  send();
});

async function send(){
  const text = $('input').value.trim();
  if(!text || state.streaming) return;
  $('splash').classList.add('hidden');
  const inner = $('streamInner');
  const um = document.createElement('div');
  um.className = 'msg user';
  const avMeOk = state.avatars && state.avatars.me && state.avatars.me.url;
  um.innerHTML = '<div class="avatar'+(avMeOk?'':' me-def')+'">'+avatarSvg('me')+'</div><div class="col"><div class="bubble"><div class="body">'+md(text)+'</div></div><div class="mtime">'+fmtClock()+'</div></div>';
  inner.appendChild(um);
  $('input').value=''; autoGrow(); scrollToBottom(true);

  const ab = document.createElement('div');
  ab.className = 'msg ai';
  ab.innerHTML = '<div class="avatar">'+avatarSvg()+'</div><div class="col"><div class="bubble"><div class="typing"><i></i><i></i><i></i></div><div class="body" style="display:none"></div></div></div>';
  inner.appendChild(ab); scrollToBottom(true);

  state.streaming = true; setSendState();
  state.abortCtl = new AbortController();
  let tBuf = '', xBuf = '', had = false, err = null;
  const bodyEl = ab.querySelector('.body');
  const thinkEl = ()=>{ let d = ab.querySelector('.think'); if(!d){ d=document.createElement('details'); d.className='think'; d.innerHTML='<summary>他想了想 ▾</summary><div class="tk-body"></div>'; ab.querySelector('.bubble').insertBefore(d, bodyEl);} return d; };
  try{
    const res = await apiFetch('/api/chat', {
      method:'POST',
      body: { message: /语音|说给我听|念给我|读给我|想听/.test(text) ? text+VHINT : text, conversation_id: state.convId||null, model: state.model||null, extended:true },
      signal: state.abortCtl.signal
    });
    if(res.status===401){ logout(); return; }
    if(!res.ok){ let m='请求失败 '+res.status; try{const j=await res.json(); if(j.detail)m=j.detail;}catch(e){} throw new Error(m); }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      let idx;
      while((idx = buf.indexOf('\n\n')) >= 0){
        const block = buf.slice(0, idx); buf = buf.slice(idx+2);
        let ev='message', data='';
        for(const line of block.split('\n')){
          if(line.startsWith('event:')) ev = line.slice(6).trim();
          else if(line.startsWith('data:')) data += line.slice(5).trim();
        }
        if(!data) continue;
        let obj; try{ obj = JSON.parse(data); }catch(e){ continue; }
        if(ev==='conversation' && obj.conversation_id){
          state.convId = obj.conversation_id; localStorage.setItem(LS.conv, state.convId);
        }else if(ev==='thinking'){
          tBuf += obj.text||'';
          if(thinkOn() && !had){ const d = thinkEl(); d.querySelector('.tk-body').textContent = tBuf; ab.querySelector('.typing').style.display='none'; bodyEl.style.display=''; had=true; scrollToBottom(); }
        }else if(ev==='delta'){
          xBuf += obj.text||'';
          if(!had){ ab.querySelector('.typing').style.display='none'; bodyEl.style.display=''; had=true; }
          bodyEl.innerHTML = md(xBuf); scrollToBottom();
        }else if(ev==='error'){
          err = obj.message||'出错了';
        }
      }
    }
  }catch(e){
    if(e.name!=='AbortError') err = err || (e.message||'网络中断');
  }
  ab.querySelector('.typing') && (ab.querySelector('.typing').style.display='none');
  bodyEl.style.display='';
  if(xBuf){
    bodyEl.innerHTML = md(xBuf);
    if(!err){
      const vText=extractVoice(xBuf);
      const bodyText=vText!==null?vText:xBuf.trim();
      const chunks=splitAiText(bodyText);
      const frag=document.createDocumentFragment();
      chunks.forEach((c,i)=>frag.appendChild(aiMsgNode(c,{cont:i>0, thinking:i===0?tBuf:'', mtime:i===chunks.length-1?fmtClock():''})));
      if(vText) frag.appendChild(voiceMsgNode(vText));
      ab.replaceWith(frag);
    }else{
      const vb=document.createElement('div'); vb.innerHTML=makeVoiceBar(xBuf.trim()); ab.querySelector('.bubble').appendChild(vb.firstChild);
    }
  }
  else if(!tBuf && !had){ bodyEl.innerHTML = ''; }
  if(err){ const d = document.createElement('div'); d.className='msg-err'; d.textContent='⚠ '+err; ab.querySelector('.bubble').appendChild(d); }
  if(!xBuf && !tBuf && !err){ bodyEl.innerHTML = '<span style="color:var(--text3)">（没有收到回复）</span>'; }
  state.streaming = false; state.abortCtl = null; setSendState();
  scrollToBottom();
  loadSessions();
}

const ICO_BURST='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#DD7A55" stroke-width="2" stroke-linecap="round"><path d="M15.2 12H20.6M14.8 13.6 17.5 15.2M13.6 14.8 16.3 19.4M12 15.2V18.4M10.4 14.8 7.7 19.4M9.2 13.6 6.5 15.2M8.8 12H3.4M9.2 10.4 6.5 8.8M10.4 9.2 7.7 4.6M12 8.8V5.6M13.6 9.2 16.3 4.6M14.8 10.4 17.5 8.8"/></svg>';
const ICO_STAR='<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C13 8 16 11 22 12 16 13 13 16 12 22 11 16 8 13 2 12 8 11 11 8 12 2Z"/></svg>';
function modelIconSvg(id){
  id = String(id||'');
  if(/glm|zhipu|chatglm/i.test(id)) return ICO_CUBE;
  if(/deepseek/i.test(id)) return ICO_WHALE;
  if(/claude/i.test(id)) return ICO_BURST;
  return ICO_STAR;
}
function renderModelIcon(){ const el=$('cModelIcon'); if(el) el.innerHTML = modelIconSvg(state.model); }
function renderModelLabel(){
  const m = state.models.find(x=>x.id===state.model);
  $('modelLabel').textContent = m ? (m.label||m.id) : '模型';
  renderModelIcon();
}
function openSheet(id){ $(id).classList.add('on'); $('scrim').classList.add('on'); }
function closeSheets(){
  $('modelSheet').classList.remove('on'); $('settingsSheet').classList.remove('on');
  if(!$('sidebar').classList.contains('open')) $('scrim').classList.remove('on');
}
function openModelSheet(){
  const box = $('modelList'); box.innerHTML='';
  for(const m of state.models){
    const b = document.createElement('button');
    b.className = 'm-item' + (m.id===state.model?' on':'');
    b.innerHTML = '<span class="mt">'+esc(m.label||m.id)+'</span><span class="md">'+esc(m.desc||'')+(m.thinking==='adaptive'?' · 思考自适应':m.thinking==='none'?' · 无思考':'')+'</span>';
    b.addEventListener('click', ()=>{
      state.model = m.id; localStorage.setItem(LS.model, m.id);
      renderModelLabel(); closeSheets(); toast('已切换到 '+(m.label||m.id));
    });
    box.appendChild(b);
  }
  openSheet('modelSheet');
}
$('btnModel').addEventListener('click', openModelSheet);
$('btnCModel').addEventListener('click', openModelSheet);
$('btnPlus').addEventListener('click', ()=>toast('还没想好让你加什么，先好看着', 2200));

/* ───────── 设置 sheet ───────── */
$('btnSettings').addEventListener('click', async ()=>{
  closeSidebar();
  $('memoryArea').value = '加载中…';
  $('personaArea').value = '加载中…';
  $('apiBaseInput').value = (localStorage.getItem(LS.apiBase) || '').trim();
  $('apiTokenInput').value = (localStorage.getItem(LS.apiToken) || '').trim();
  refreshAvPreviews();
  openSheet('settingsSheet');
  try{
    const r = await api('/api/memory-summary');
    const t = typeof r === 'string' ? r : (r.text || r.summary || (r.content || JSON.stringify(r, null, 1)));
    $('memoryArea').value = t || '';
  }catch(e){ $('memoryArea').value = ''; }
  try{
    const p = await api('/api/persona');
    $('personaArea').value = p.system_prompt || '';
  }catch(e){ $('personaArea').value = ''; }
});
$('btnSavePersona').addEventListener('click', async ()=>{
  const txt = $('personaArea').value.trim();
  if(!txt){ toast('人设内容不能为空'); return; }
  if(txt.length > 8000){ toast('人设最长 8000 字，现在 ' + txt.length + ' 字'); return; }

function wallShrink(img, quality, maxSide){
  const cv=document.createElement('canvas');
  const sc=Math.min(1, maxSide/Math.max(img.width,img.height));
  cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
  return cv.toDataURL('image/jpeg', quality);
}
function wallCompress(file, cb){
  const rd=new FileReader();
  rd.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      let out=wallShrink(img,.82,1440);
      if(out.length>340000) out=wallShrink(img,.62,1440);
      if(out.length>340000) out=wallShrink(img,.45,1280);
      if(out.length>340000) out=wallShrink(img,.38,1080);
      cb(out,out.length);
    };
    img.onerror=()=>cb('',0);
    img.src=rd.result;
  };
  rd.readAsDataURL(file);
}

function lum(hex){ try{ const n=parseInt(hex.slice(1),16); return (0.299*((n>>16)&255)+0.587*((n>>8)&255)+0.114*(n&255))/255; }catch(e){ return 0; } }
const PALETTE=['#A5B9DC','#D98A9E','#E8A2B8','#8E7CC3','#5E8D9E','#7FBFA8','#D9A066','#C9A86A','#A0525F','#3D4E7A','#4A6E5D','#16161C'];
function shade(hex,f){ try{ const n=parseInt(hex.slice(1),16); const r=Math.round(((n>>16)&255)*f),g=Math.round(((n>>8)&255)*f),b=Math.round((n&255)*f); return '#'+[r,g,b].map(x=>Math.min(255,x).toString(16).padStart(2,'0')).join(''); }catch(e){ return hex; } }
function tint(){ try{ return JSON.parse(localStorage.getItem(LS.theme)||'{}'); }catch(e){ return {}; } }

<script>
(function(){
  const orb=document.getElementById('orbFloat');
  if(!orb)return;
  const lens=document.getElementById('orbLens');
  const dock=document.getElementById('dock');
  const K=1.2;
  let sx=0,sxOrb=0,moved=false,active=false,inner=null;
  function buildLens(d){
    if(!lens||!dock)return;
    inner=document.createElement('div');inner.className='orb-lens-inner';
    const clone=dock.cloneNode(true);
    clone.removeAttribute('id');
    clone.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));
    clone.style.cssText='margin:0;width:'+d.width+'px;flex-shrink:0;';
    inner.appendChild(clone);
    inner.style.transform='scale('+K+')';
    lens.appendChild(inner);
  }
  function syncLens(){
    if(!lens||!dock)return;
    const d=dock.getBoundingClientRect(), o=orb.getBoundingClientRect();
    if(!inner)buildLens(d);
    if(!inner)return;
    inner.style.left=((d.left-o.left)*K)+'px';
    inner.style.top=((d.top-o.top)*K)+'px';
  }
  function place(){
    if(!dock)return;
    const d=dock.getBoundingClientRect();
    let x=null;
    try{const p=JSON.parse(localStorage.getItem('cn_orb')||'null');
      if(p&&isFinite(p.x))x=p.x;}catch(e){}
    if(x==null)x=(window.innerWidth-orb.offsetWidth)/2;
    x=Math.min(Math.max(x,4),window.innerWidth-orb.offsetWidth-4);
    orb.style.left=x+'px';
    orb.style.top=Math.max(4,d.top-orb.offsetHeight*0.3)+'px';
  }
  place();
  orb.addEventListener('pointerdown',e=>{active=true;moved=false;sx=e.clientX;sxOrb=parseFloat(orb.style.left)||0;orb.classList.add('dragging');
    try{orb.setPointerCapture(e.pointerId);}catch(err){}});
  orb.addEventListener('pointermove',e=>{if(!active)return;
    const dx=e.clientX-sx;
    if(!moved&&Math.abs(dx)<6)return;moved=true;
    const w=orb.offsetWidth;
    const nx=Math.min(Math.max(sxOrb+dx,4),window.innerWidth-w-4);
    orb.style.left=nx+'px';syncLens();});
  const end=()=>{if(!active)return;active=false;orb.classList.remove('dragging');
    if(moved){try{localStorage.setItem('cn_orb',JSON.stringify({x:parseFloat(orb.style.left)}));}catch(err){}}
    else{const chat=document.querySelector('.dock-btn[data-view="chat"]');
      if(chat)chat.click();orb.classList.add('pulse');setTimeout(()=>orb.classList.remove('pulse'),520);}};
  orb.addEventListener('pointerup',end);orb.addEventListener('pointercancel',end);
  window.addEventListener('resize',()=>{inner=null;lens.innerHTML='';place();setTimeout(syncLens,80);});
  setTimeout(syncLens,300);
})();
</script>

<script>
(function(){
  const dock=document.getElementById('dock');
  const fe=document.getElementById('lgMapImg');
  const fl=document.getElementById('lgLens');
  if(!dock||!fe||!fl)return;
  function fit(){
    const r=dock.getBoundingClientRect();
    const w=Math.max(2,Math.round(r.width)),h=Math.max(2,Math.round(r.height));
    fl.setAttribute('width',w);fl.setAttribute('height',h);
    fe.setAttribute('width',w);fe.setAttribute('height',h);
  }
  fit();
  window.addEventListener('resize',()=>setTimeout(fit,120));
})();
</script>
