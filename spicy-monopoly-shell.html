<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spicy Monopoly · Shell</title>
<!-- ═══════════════════════════════════════════════════════════════
  spicy-monopoly 网页前端壳（纯壳 · 假数据渲染 · 未接接口）
  ─────────────────────────────────────────────────────────────
  铁律（平台合规）：
  · 本文件零游戏文案硬编码——任务卡、格子描述、身份卡、任何库内容
    一律不写进代码；所有内容展示位均为数据占位，等接口下发后渲染。
  · 代码中出现的类型键（start/task/truth/shop/card/mystery/jail/duel/normal）
    仅为布局机制的枚举标识，非游戏文案。
  · 接口层 API.* 目前为空实现；对接时按哥哥的接口约定文档填充，
    页面渲染只认数据，不认任何写死的字。
  ═══════════════════════════════════════════════════════════════ -->
<style>
/* ═══ ChatNest·星夜小筑 同源设计变量（浅色为默认 + data-theme 暗色） ═══ */
:root{
  --fs:15px;
  --bg0:#EEF1F7;--bg1:#F3F5FA;--bg2:#E7EBF3;
  --panel:rgba(255,255,255,.74);--panel2:rgba(30,40,80,.05);--panel3:rgba(30,40,80,.09);
  --panel-solid:#F6F8FC;
  --line:rgba(30,40,80,.12);--line2:rgba(30,40,80,.19);
  --text:#16181D;--text2:#565C6E;--text3:#8A90A2;
  --accent:#7C8BC9;--accent2:#4A57A5;--moon:#9C7B46;--danger:#C05656;
  --user-b1:#F2EDE7;--user-b2:#E7E0D8;--user-fg:#1B1C22;
  --ai-b:rgba(255,255,255,.66);--ai-line:rgba(30,40,80,.14);
  --shadow:0 8px 28px rgba(40,60,120,.13);
  --ease:cubic-bezier(.22,.8,.3,1);
  /* 棋盘类型色 · 低饱和夜空系（布局机制枚举配色，非游戏文案） */
  --t-start:#5BB8A0;--t-task:#D97A7A;--t-truth:#D98BA5;--t-shop:#C9A25E;
  --t-card:#4A57A5;--t-mystery:#7C8BC9;--t-jail:#9BA1B8;--t-duel:#C97B5B;--t-normal:#AEB6D8;
  --cell-bg:rgba(255,255,255,.62);
  --board-bg:linear-gradient(145deg,rgba(255,255,255,.5),rgba(231,235,243,.35));
  --dice-bg:linear-gradient(145deg,#FDFCFB,#E7E0D8);--dice-fg:#1B1C22;
  --pawn-ring:rgba(255,255,255,.9);
  --star:rgba(40,60,120,.16);
}
[data-theme="dark"]{
  --bg0:#050508;--bg1:#08090F;--bg2:#0D0F18;
  --panel:rgba(18,24,48,.78);--panel2:rgba(255,255,255,.05);--panel3:rgba(255,255,255,.08);
  --panel-solid:#111731;
  --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
  --text:#E9EBF4;--text2:#9BA1B8;--text3:#626A85;
  --accent:#A5B9DC;--accent2:#CBD8EF;--moon:#E3C89E;--danger:#D97A7A;
  --user-b1:#F2EDE7;--user-b2:#E7E0D8;--user-fg:#1B1C22;
  --ai-b:rgba(12,13,18,.42);--ai-line:rgba(255,255,255,.22);
  --shadow:0 8px 28px rgba(0,0,0,.38);
  --t-start:#4E9C88;--t-task:#B05F5F;--t-truth:#B06F8C;--t-shop:#A98A50;
  --t-card:#5A66B8;--t-mystery:#6E7FB5;--t-jail:#6E7488;--t-duel:#B06A4E;--t-normal:#2A3352;
  --cell-bg:rgba(30,40,80,.35);
  --board-bg:linear-gradient(145deg,rgba(17,23,49,.6),rgba(8,9,15,.5));
  --dice-bg:linear-gradient(145deg,#F2EDE7,#D8CFBF);--dice-fg:#1B1C22;
  --pawn-ring:rgba(255,255,255,.85);
  --star:rgba(255,255,255,.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;max-width:100%}
body{
  background:var(--bg0);color:var(--text);
  font-family:-apple-system,system-ui,'PingFang SC','HarmonyOS Sans SC',sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
  transition:background .3s;
}
/* 星点背景（纯装饰） */
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 22%,var(--star) 50%,transparent 51%),
    radial-gradient(1px 1px at 34% 8%,var(--star) 50%,transparent 51%),
    radial-gradient(2px 2px at 58% 30%,var(--star) 50%,transparent 51%),
    radial-gradient(1px 1px at 78% 14%,var(--star) 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 90% 42%,var(--star) 50%,transparent 51%),
    radial-gradient(1px 1px at 22% 68%,var(--star) 50%,transparent 51%),
    radial-gradient(2px 2px at 66% 78%,var(--star) 50%,transparent 51%),
    radial-gradient(1px 1px at 44% 88%,var(--star) 50%,transparent 51%);
}
/* ── 顶栏：局信息 + 金币状态 ── */
.topbar{
  display:flex;align-items:center;gap:14px;position:relative;z-index:2;
  padding:10px 18px;border-bottom:1px solid var(--line);
  background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);flex:none;
}
.brand{font-weight:800;letter-spacing:.5px;font-size:15px;color:var(--text2)}
.brand b{color:var(--accent2)}
.round-pill{
  font-size:12.5px;color:var(--text2);background:var(--panel3);
  border:1px solid var(--line);border-radius:99px;padding:4px 12px;
  font-variant-numeric:tabular-nums;
}
.theme-btn{
  border:1px solid var(--line);background:var(--panel3);color:var(--text2);
  border-radius:99px;width:32px;height:32px;cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;transition:transform .3s var(--ease);
}
.theme-btn:active{transform:rotate(30deg)}
.coin-group{margin-left:auto;display:flex;gap:10px}
.coin-card{
  display:flex;align-items:center;gap:8px;
  background:var(--panel3);border:1px solid var(--line);border-radius:12px;
  padding:6px 14px;font-size:14px;
}
.coin-card .dot{width:10px;height:10px;border-radius:50%;flex:none}
.coin-card .pname{color:var(--text2);font-size:12.5px}
.coin-card .coins{font-weight:700;color:var(--moon);font-variant-numeric:tabular-nums}
/* ── 主区：棋盘 + 聊天栏 ── */
.main{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;z-index:1}
.stage{flex:none;display:flex;justify-content:center;padding:14px 18px 6px;min-width:0}
/* 聊天记录：棋盘下方空白，纯文字行直接铺在背景上（无框无面板） */
.talklog{
  flex:1;min-height:0;overflow-y:auto;
  display:flex;flex-direction:column;gap:6px;
  padding:8px 28px 4px;
}
/* 棋盘：6x6 外圈 = 20 格，磨砂玻璃面板 */
.board{
  --sz:78px;
  display:grid;grid-template-columns:repeat(6,var(--sz));grid-template-rows:repeat(6,var(--sz));
  gap:8px;padding:14px;border-radius:22px;
  background:var(--board-bg);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
}
.cell{
  position:relative;border-radius:12px;overflow:visible;
  background:var(--cell-bg);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:box-shadow .3s var(--ease),border-color .3s,filter .3s;
}
/* 类型标识：角上一颗小点（色取类型变量），格子本体保持素净玻璃 */
.cell::before{
  content:'';position:absolute;top:6px;left:6px;
  width:6px;height:6px;border-radius:50%;
  background:var(--cbg,var(--t-normal));opacity:.85;
}
.cell .no{font-size:10.5px;color:var(--text);opacity:.55;letter-spacing:1px;font-variant-numeric:tabular-nums}
.cell .tag{font-size:9.5px;color:var(--text);opacity:.7;margin-top:2px;letter-spacing:.5px}
.cell.owned{border-color:var(--own,#fff);box-shadow:inset 0 0 0 2px var(--own,#fff)}
.cell.cur{box-shadow:0 0 0 2px var(--accent2),0 6px 18px var(--panel3)}
.cell .pawns{position:absolute;inset:auto 3px 3px auto;display:flex;gap:3px}
.pawn{
  width:16px;height:16px;border-radius:50%;
  border:2px solid var(--pawn-ring);box-shadow:0 2px 8px rgba(0,0,0,.25);
  transition:transform .28s cubic-bezier(.34,1.56,.64,1);
}
.pawn.bounce{animation:pbounce .5s}
@keyframes pbounce{0%{transform:scale(1)}40%{transform:scale(1.7) translateY(-6px)}100%{transform:scale(1)}}
/* 中心面板：只管游戏（骰子+掷骰），聊天在棋盘下方空白 */
.center-panel{
  grid-area:2/2/6/6;
  border-radius:16px;background:var(--panel);border:1px solid var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:16px;text-align:center;
}
.dice{
  width:64px;height:64px;border-radius:16px;
  background:var(--dice-bg);color:var(--dice-fg);
  font-size:30px;font-weight:900;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow);
  font-variant-numeric:tabular-nums;
}
.dice.rolling{animation:roll .62s cubic-bezier(.36,.07,.19,.97)}
@keyframes roll{
  0%{transform:rotate(0) scale(1)}25%{transform:rotate(95deg) scale(1.12)}
  50%{transform:rotate(190deg) scale(.94)}75%{transform:rotate(285deg) scale(1.1)}
  100%{transform:rotate(360deg) scale(1)}
}
/* 聊天文字行：颜色区分角色，内容由接口下发 */
.line{font-size:13px;line-height:1.65;color:var(--text2);word-break:break-all}
.line b{color:var(--text);font-weight:600}   /* 发送者署名（名字由接口下发） */
.line.me{color:var(--text)}
.line.sys{color:var(--text3);font-size:11.5px;text-align:center}
.line.event{color:var(--accent2);font-size:12.5px;text-align:center}
/* 自定义背景图层：图片在最底，主题色罩保证可读性（罩色随主题切换） */
:root{--bg-dim:rgba(238,241,247,.58)}
[data-theme="dark"]{--bg-dim:rgba(10,14,30,.55)}
.bg-photo{
  position:fixed;inset:0;z-index:-2;
  background-position:center;background-size:cover;background-repeat:no-repeat;
}
.bg-photo-dim{position:fixed;inset:0;z-index:-1;background:var(--bg-dim);display:none}
/* 底部空白 = 打字处：全宽透明，无框无线无按钮，文字贴左，光标落在空白里 */
.typebar{flex:none;padding:0 26px 16px}
.typebar form{display:block;margin:0}
.typebar input{
  display:block;width:100%;background:transparent;border:none;outline:none;
  color:var(--text);font-size:14px;line-height:1.7;padding:8px 2px;
  caret-color:var(--accent2);
}
.typebar input::placeholder{color:var(--text3);opacity:.5}
.btn-roll{
  border:none;cursor:pointer;border-radius:99px;
  padding:13px 42px;font-size:16px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:var(--shadow);
  transition:transform .15s var(--ease),opacity .2s;
  letter-spacing:2px;
}
.btn-roll:active{transform:scale(.95)}
.btn-roll:disabled{opacity:.45;cursor:not-allowed}
/* ── 剧情幕：全屏演绎舞台（剧本由接口下发，壳零文案）──
   action=动作描写(旁白) / line=对白(署名)，逐段推进+打字机 */
.drama{
  position:fixed;inset:0;z-index:40;
  background:rgba(12,16,34,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:none;flex-direction:column;
  cursor:pointer;user-select:none;-webkit-user-select:none;
}
.drama.show{display:flex;animation:dramaIn .35s var(--ease)}
@keyframes dramaIn{from{opacity:0}to{opacity:1}}
.drama-scroll{
  flex:1;overflow-y:auto;display:flex;flex-direction:column;justify-content:flex-end;
  gap:14px;padding:48px 24px 24px;
}
.drama .dseg{max-width:680px;width:100%;margin:0 auto;opacity:0;animation:segIn .3s var(--ease) forwards}
@keyframes segIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.dseg.action{
  text-align:center;font-style:italic;font-size:13.5px;line-height:1.9;
  color:var(--text3);
}
.dseg.line{font-size:14px;line-height:1.85;color:var(--text2)}
.dseg.line b{color:var(--moon);font-weight:700}
.drama-foot{
  flex:none;display:flex;gap:12px;align-items:flex-end;
  padding:10px 20px calc(18px + env(safe-area-inset-bottom));
}
.drama-inputs{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
/* 双输入口：动作(斜体旁白) / 台词(正常)，均透明无框 */
.drama-inputs form{display:block;margin:0;min-width:0}
.drama-inputs input{
  display:block;width:100%;background:transparent;border:none;outline:none;
  color:var(--text);font-size:14px;line-height:1.6;padding:6px 4px;
  caret-color:var(--accent2);
}
.drama-inputs input::placeholder{color:var(--text3);opacity:.5}
.drama-inputs input:disabled{opacity:.4}
.drama-inputs .act input{
  font-style:italic;color:var(--text2);
  caret-color:var(--text3);
}
.drama-foot button{
  flex:none;border:1px solid var(--line);background:var(--panel3);color:var(--text3);
  border-radius:99px;padding:8px 14px;font-size:12px;cursor:pointer;
}
.drama-next{font-size:12px;color:var(--text3);letter-spacing:2px;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
/* ── 退出确认：点返回键弹出，确认才回星夜小筑 ── */
.exit-mask{
  position:fixed;inset:0;z-index:50;display:none;
  align-items:center;justify-content:center;
  background:rgba(12,16,34,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.exit-mask.show{display:flex;animation:dramaIn .25s var(--ease)}
.exit-card{
  width:min(78vw,300px);border-radius:20px;
  background:var(--panel-solid);border:1px solid var(--line);
  box-shadow:var(--shadow);padding:22px 20px 16px;text-align:center;
}
.exit-title{font-size:15px;font-weight:700;color:var(--text)}
.exit-sub{margin-top:6px;font-size:12px;color:var(--text3)}
.exit-btns{margin-top:16px;display:flex;gap:10px}
.exit-btns button{
  flex:1;border:none;cursor:pointer;border-radius:99px;
  padding:10px 0;font-size:13.5px;font-weight:700;
  transition:transform .15s var(--ease);
}
.exit-btns button:active{transform:scale(.95)}
.exit-no{background:var(--panel3);color:var(--text2);border:1px solid var(--line)}
.exit-yes{background:linear-gradient(135deg,var(--danger),#a53f3f);color:#fff}
/* 窄屏：棋盘缩放 + 顶栏紧凑化（防横向溢出） */
@media (max-width:860px){
  .board{--sz:min(12vw,56px);gap:4px;padding:8px}
  .stage{padding:8px 8px 12px}
  .center-panel{padding:10px 12px;gap:8px}
  .dice{width:52px;height:52px;font-size:24px}
  .btn-roll{padding:9px 28px;font-size:14px}
  .topbar{gap:8px;padding:8px 12px}
  .brand{font-size:0}
  .brand b{font-size:13px}
  .round-pill{display:none}
  .theme-btn{padding:7px 9px;font-size:13px}
  .coin-group{gap:6px}
  .coin-card{padding:5px 9px;gap:5px}
  .coin-card .pname{display:none}
  .coin-card .coins{font-size:11.5px}
  .talklog{padding:6px 14px 2px}
  .typebar{padding:0 14px 12px}
}
</style>
</head>
<body>
<div class="stars"></div>

<header class="topbar">
  <button class="theme-btn" id="exitBtn" title="返回">‹</button>
  <div class="brand"><b>SPICY</b> MONOPOLY</div>
  <div class="round-pill" id="roundPill">— / —</div>
  <button class="theme-btn" id="themeBtn" title="主题">☾</button>
  <button class="theme-btn" id="bgBtn" title="自定义背景">🖼</button>
  <button class="theme-btn" id="bgClear" title="恢复默认背景" style="display:none">✕</button>
  <input type="file" id="bgFile" accept="image/*" style="position:fixed;left:-9999px;top:0;opacity:0">
  <div class="coin-group" id="coinGroup"></div>
</header>

<div class="main">
  <div class="stage"><div class="board" id="board"></div></div>
  <div class="talklog" id="evLog"></div>
  <div class="typebar"><form id="typeForm"><input id="chatInput" placeholder="…" autocomplete="off"></form></div>
</div>

<!-- 剧情幕：接龙舞台——AI 与玩家轮流即兴演绎，动作/对白均为实时生成，壳零文案 -->
<div class="drama" id="drama">
  <div class="drama-scroll" id="dramaScroll"></div>
  <div class="drama-foot">
    <div class="drama-inputs">
      <form class="act" id="dramaActForm"><input id="dramaAct" placeholder="…" autocomplete="off"></form>
      <form class="say" id="dramaSayForm"><input id="dramaInput" placeholder="…" autocomplete="off"></form>
    </div>
    <button id="dramaEnd">✕</button>
  </div>
</div>

<!-- 退出确认：第一次及每次点返回键都会先问 -->
<div class="exit-mask" id="exitMask">
  <div class="exit-card">
    <div class="exit-title">是否要退出房间？</div>
    <div class="exit-sub">退出后回到星夜小筑</div>
    <div class="exit-btns">
      <button class="exit-no" id="exitNo">留下</button>
      <button class="exit-yes" id="exitYes">退出</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
  数据层（全部为演示假数据 · 严禁在壳内写死任何游戏内容）
  ─────────────────────────────────────────────────────────
  对接原则：cells/players/chat 的 label、desc、icon、name 等一切
  展示字段一律由接口下发；本文件只保留渲染与交互骨架。
  API 对象为预留挂载点，等接口约定文档后填充实现。
  ═══════════════════════════════════════════════════════════ */
const API = {
  base: 'https://spicy-monopoly.lol',   // 接口基地址（按约定替换）
  // TODO(对接): newGame / roll / state / action —— 等接口约定文档
};

/* 假数据：类型枚举仅为布局演示；label/icon 置 null → 渲染为序号占位 */
const state = {
  gameId: null,
  gameLength: 24,
  round: 1,
  turnOf: 0,                       // 0/1 = 玩家索引
  cells: Array.from({length:20},(_,i)=>({
    type: mockType(i),             // 布局演示用的类型枚举
    label: null, icon: null,       // ★ 内容占位：一律接口下发
    owner: (i===3||i===11) ? 0 : (i===7 ? 1 : null),
  })),
  players: [
    { name:'P1', color:'#4cc9f0', coins:123, cell:0, dsc:'—' },
    { name:'P2', color:'#ff6d9d', coins:87,  cell:5, dsc:'—' },
  ],
};
function mockType(i){
  const seq = ['start','task','truth','task','normal','shop',
               'task','card','mystery','task','truth','task',
               'normal','shop','duel','task','card','jail','mystery','task'];
  return seq[i] || 'normal';
}

/* ═══ 渲染 ═══ */
const boardEl = document.getElementById('board');
const TYPE_CLS = {start:'t-start',task:'t-task',truth:'t-truth',shop:'t-shop',
                  card:'t-card',mystery:'t-mystery',jail:'t-jail',duel:'t-duel',normal:'t-normal'};

/* 20 格 → 6x6 外圈坐标：底边(0-5)→左边(6-9)→顶边(10-15)→右边(16-19) */
function cellRC(i){
  if(i<=5)  return [5, 5-i];
  if(i<=9)  return [4-(i-6), 0];
  if(i<=15) return [0, i-10];
  return [i-16+1, 5];
}

function renderBoard(){
  boardEl.innerHTML='';
  /* 中心面板 */
  const cp=document.createElement('div');
  cp.className='center-panel';
  cp.style.gridArea='2/2/6/6';
  cp.innerHTML=`
    <div class="dice" id="dice">?</div>
    <button class="btn-roll" id="btnRoll">掷骰</button>`;
  boardEl.appendChild(cp);

  state.cells.forEach((c,i)=>{
    const [r,col]=cellRC(i);
    const el=document.createElement('div');
    el.className='cell'+(c.owner!=null?' owned':'');
    el.style.gridArea=`${r+1}/${col+1}`;
    /* 格色走主题变量：--t-{type} 由浅/暗两套 CSS 自动切换 */
    el.style.setProperty('--cbg',`var(--${TYPE_CLS[c.type]||'t-normal'})`);
    el.style.setProperty('--own', c.owner!=null?state.players[c.owner].color:'');
    el.dataset.idx=i;
    /* 内容占位：label/icon 为空 → 只渲染序号（不写任何描述性文字） */
    el.innerHTML=`<div class="no">${String(i+1).padStart(2,'0')}</div>`+
                 (c.label?`<div class="tag"></div>`:'');
    const pw=document.createElement('div'); pw.className='pawns'; el.appendChild(pw);
    boardEl.appendChild(el);
  });
  placeAllPawns();
  renderRound(); renderCoins();
}

function placePawn(pi,animate){
  const p=state.players[pi];
  const cell=boardEl.querySelector(`.cell[data-idx="${p.cell}"]`);
  if(!cell)return;
  cell.querySelector('.pawns').querySelectorAll(`[data-p="${pi}"]`).forEach(n=>n.remove());
  const pn=document.createElement('div');
  pn.className='pawn'+(animate?' bounce':'');
  pn.dataset.p=pi;
  pn.style.background=p.color;
  cell.querySelector('.pawns').appendChild(pn);
  boardEl.querySelectorAll('.cell.cur').forEach(x=>x.classList.remove('cur'));
  cell.classList.add('cur');
}
function placeAllPawns(){ state.players.forEach((_,i)=>placePawn(i,false)); }

function renderCoins(){
  document.getElementById('coinGroup').innerHTML = state.players.map(p=>`
    <div class="coin-card">
      <span class="dot" style="background:${p.color}"></span>
      <span class="pname"></span>
      <span class="coins">🪙 ${p.coins}</span>
    </div>`).join('');
  /* 玩家名等接口下发后填充，壳内不写名 */
  const names=document.querySelectorAll('#coinGroup .pname');
  names.forEach((n,i)=>{ n.textContent=state.players[i].name; });
}
function renderRound(){
  document.getElementById('roundPill').textContent=
    `R ${state.round} / ${state.gameLength}`;
}

/* ═══ 假交互演示（壳自嗨用，对接后整段替换） ═══ */
function demoRoll(){
  const btn=document.getElementById('btnRoll'); if(!btn)return;
  btn.disabled=true;
  const dice=document.getElementById('dice');
  dice.textContent='?'; dice.classList.remove('rolling'); void dice.offsetWidth;
  dice.classList.add('rolling');
  const n=1+Math.floor(Math.random()*6);
  setTimeout(()=>{
    dice.textContent=n;
    const who=state.turnOf, p=state.players[who];
    const from=p.cell, target=(from+n)%20;
    /* 逐步走格动画：from+1 … target */
    let step=from;
    const walk=setInterval(()=>{
      step=(step+1)%20;
      p.cell=step; placePawn(who,true);
      if(step===target){ clearInterval(walk); arrive(who,n); }
    },130);
  },640);
}
function arrive(who,n){
  const p=state.players[who];
  const cell=state.cells[p.cell];
  /* 事件行占位：真实文案等接口 */
  addMsg('event','掷出 '+n+' · 落第 '+(p.cell+1)+' 格 · 事件内容由接口下发');
  /* 任务/剧情类格子演示：全屏剧情幕（真剧本由接口下发） */
  if(['task','truth','card'].includes(cell.type)) setTimeout(()=>demoDrama(cell.type),450);
  state.turnOf=1-state.turnOf;
  renderRound();
  const btn=document.getElementById('btnRoll'); if(btn)btn.disabled=false;
}
function demoDrama(type){
  /* 接龙舞台演示：AI 开场段为占位回包，之后轮到玩家续写；
     真实对接时 AI 段落由对话接口（游戏场景提示）实时生成 */
  openDrama(()=>{
    pushSeg('action','（AI 动作描写 · 占位回包 · 触发类型 '+type+'）',null,true);
    pushSeg('line','（AI 对白 · 占位回包）',state.players[1].name,true);
  },()=>{
    addMsg('me','（演示 · 剧情落幕回执占位）',state.players[0].name);
  });
}

/* ═══ 剧情幕（接龙舞台 · 你和 AI 轮流即兴演绎） ═══
   段落两种：action=动作描写(旁白，无署名) / line=对白(署名)
   全部文字都是运行时生成（AI 回包 / 玩家输入），壳零文案 */
const drama=document.getElementById('drama'),
      dramaScroll=document.getElementById('dramaScroll'),
      dramaInput=document.getElementById('dramaInput'),
      dramaAct=document.getElementById('dramaAct'),
      dramaEnd=document.getElementById('dramaEnd');
let dTyping=null;
function setInputs(dis){ dramaInput.disabled=dis; dramaAct.disabled=dis; }
/* 舞台记录持久化：整局游戏内累积（落幕/刷新不清），新开一局时由接口侧调 clearDramaLog() */
const DLOG_KEY='sm_drama_log';
let dLog=[];
try{ dLog=JSON.parse(localStorage.getItem(DLOG_KEY)||'[]'); }catch(e){ dLog=[]; }
function saveDLog(){ try{ localStorage.setItem(DLOG_KEY,JSON.stringify(dLog)); }catch(e){} }
function clearDramaLog(){  /* 对接点：新游戏局开始时调用 */
  dLog=[]; saveDLog();
}
function pushSeg(kind,text,who,typewriter){
  dLog.push({kind:kind,who:who||null,text:String(text||'')}); saveDLog();
  const el=document.createElement('div');
  el.className='dseg '+kind;
  if(kind==='line'&&who){
    const b=document.createElement('b'); b.textContent=who;   /* 署名=数据 */
    el.appendChild(b);
    el.appendChild(document.createTextNode('：'));
  }
  const span=document.createElement('span');
  el.appendChild(span);
  dramaScroll.appendChild(el);
  if(typewriter){
    let i=0; const full=String(text||'');
    setInputs(true);
    clearInterval(dTyping);
    dTyping=setInterval(()=>{          /* 打字机：AI 正在写 */
      i++;
      span.textContent=full.slice(0,i);
      dramaScroll.scrollTop=dramaScroll.scrollHeight;
      if(i>=full.length){ clearInterval(dTyping); dTyping=null; setInputs(false); }
    },26);
  }else{
    span.textContent=String(text||'');
  }
  dramaScroll.scrollTop=dramaScroll.scrollHeight;
  return span;
}
function openDrama(aiOpening,onEnd){
  drama._onEnd=onEnd||null;
  dramaScroll.innerHTML='';
  /* 先铺本局历史记录（直读无打字机），新剧情接在后面 */
  dLog.forEach(s=>{
    const el=document.createElement('div'); el.className='dseg '+s.kind;
    if(s.kind==='line'&&s.who){
      const b=document.createElement('b'); b.textContent=s.who;
      el.appendChild(b); el.appendChild(document.createTextNode('：'));
    }
    const sp=document.createElement('span'); sp.textContent=s.text||'';
    el.appendChild(sp); dramaScroll.appendChild(el);
  });
  dramaScroll.scrollTop=dramaScroll.scrollHeight;
  drama.classList.add('show');
  setInputs(true);
  (aiOpening||function(){})();       /* AI 开场（真实对接=请求对话接口） */
}
function closeDrama(){
  clearInterval(dTyping); dTyping=null;
  drama.classList.remove('show');    /* 记录保留在 dLog/存储，下次进幕恢复 */
  dramaInput.value=''; dramaAct.value='';
  setInputs(false);
  const cb=drama._onEnd; drama._onEnd=null;
  if(cb)cb();
}
function dramaActSend(){
  /* 动作口：玩家旁白，可连发铺垫，不触发 AI 回合 */
  const v=dramaAct.value.trim(); if(!v||dTyping)return;
  pushSeg('action',v,null,false);
  dramaAct.value='';
  if(API.code) API.say(v,'stage_action').catch(()=>{});
}
function dramaSend(){
  /* 台词口：说完话=回合结束，她来接 */
  const v=dramaInput.value.trim(); if(!v||dTyping)return;
  pushSeg('line',v,state.players[0].name,false);
  dramaInput.value='';
  if(API.code){ API.say(v,'stage_line').catch(()=>{}); return; }
  /* AI 接龙：真实对接=剧情上下文发给对话接口，返回动作+台词；此处占位回包 */
  setTimeout(()=>{
    pushSeg('action','（AI 动作描写 · 占位回包）',null,true);
    pushSeg('line','（AI 对白 · 占位回包）',state.players[1].name,true);
  },500);
}
/* 手机键盘"发送/Go"不走 Enter 事件 → 用 form submit 兜底（Enter 亦触发 submit） */
document.getElementById('dramaActForm').addEventListener('submit',e=>{ e.preventDefault(); dramaActSend(); });
document.getElementById('dramaSayForm').addEventListener('submit',e=>{ e.preventDefault(); dramaSend(); });
dramaEnd.addEventListener('click',e=>{ e.stopPropagation(); closeDrama(); });

/* ═══ 内嵌对话流（棋盘下方空白 · 纯文字行，无气泡） ═══
   荷官/我方/事件/系统 = 四种颜色行；发送者署名由接口下发（占位 P1/P2） */
let evLog=null;
function addMsg(kind,text,who){
  if(!evLog)return;                 /* 棋盘尚未渲染时忽略 */
  const m=document.createElement('div');
  m.className='line '+kind;
  if(who){
    const b=document.createElement('b');
    b.textContent=who;              /* textContent 防注入：名字永远当数据 */
    m.appendChild(b);
    m.appendChild(document.createTextNode('：'+text));
  }else{
    m.textContent=text;             /* textContent 防注入：内容永远当数据 */
  }
  evLog.appendChild(m);
  evLog.scrollTop=evLog.scrollHeight;
}

/* 事件委托：掷骰按钮（renderBoard 每次重建中心面板） */
document.addEventListener('click',e=>{
  if(e.target.id==='btnRoll') demoRoll();
});

/* ═══ 主题（ChatNest 同款双主题 · 偏好存本地） ═══ */
(function(){
  let pref=null;
  try{ pref=localStorage.getItem('sm_theme'); }catch(e){}
  const sysDark=matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;
  const apply=t=>{
    document.documentElement.setAttribute('data-theme',t);
    document.getElementById('themeBtn').textContent = t==='dark' ? '☀' : '☾';
  };
  apply(pref || (sysDark?'dark':'light'));
  document.getElementById('themeBtn').addEventListener('click',()=>{
    const cur=document.documentElement.getAttribute('data-theme');
    const nxt=cur==='dark'?'light':'dark';
    apply(nxt);
    try{ localStorage.setItem('sm_theme',nxt); }catch(e){}
  });
})();

/* ═══ 自定义背景图（仅存本浏览器 localStorage，不上传） ═══ */
(function(){
  const KEY='sm_bg';
  const photo=document.createElement('div'); photo.className='bg-photo';
  const dim=document.createElement('div');   dim.className='bg-photo-dim';
  document.body.prepend(photo,dim);
  const btn=document.getElementById('bgBtn'),
        clr=document.getElementById('bgClear'),
        file=document.getElementById('bgFile');
  function apply(v){
    photo.style.backgroundImage=v?('url('+v+')'):'';
    dim.style.display=v?'block':'none';
    clr.style.display=v?'':'none';
  }
  try{ apply(localStorage.getItem(KEY)); }catch(e){}
  /* 选图 → canvas 压到 1920 宽 JPEG，避免撑爆 localStorage */
  btn.addEventListener('click',()=>file.click());
  file.addEventListener('change',()=>{
    const f=file.files&&file.files[0]; file.value=''; if(!f)return;
    const img=new Image();
    img.onload=()=>{
      const r=Math.min(1,1920/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*r));
      c.height=Math.max(1,Math.round(img.height*r));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      const data=c.toDataURL('image/jpeg',.85);
      try{ localStorage.setItem(KEY,data); apply(data); }
      catch(e){ /* 存不下（图太大）则本次会话生效，不落盘 */ apply(data); }
    };
    img.src=URL.createObjectURL(f);
  });
  clr.addEventListener('click',()=>{
    try{ localStorage.removeItem(KEY); }catch(e){}
    apply(null);
  });
})();

renderBoard();
evLog=document.getElementById('evLog');

/* 聊天输入：form submit 兜底手机键盘"发送/Go"键 */
function sendChat(){
  const inp=document.getElementById('chatInput'); if(!inp)return;
  const v=inp.value.trim(); if(!v)return;
  addMsg('me',v,state.players[0].name);
  inp.value='';
  setTimeout(()=>addMsg('host','（回包占位 · 接口未接入）',state.players[1].name),600);
}
document.getElementById('typeForm').addEventListener('submit',e=>{ e.preventDefault(); sendChat(); });

/* 演示占位消息：内容为中性占位符，非游戏文案 */
addMsg('sys','— 演示模式 · 消息流未接入接口 —');
addMsg('host','（荷官消息占位 · 接口下发后渲染）',state.players[1].name);
addMsg('me','（玩家消息占位）',state.players[0].name);

/* ═══ 返回键：先弹确认，确认后才回星夜小筑 ═══ */
(function(){
  const mask=document.getElementById('exitMask');
  document.getElementById('exitBtn').addEventListener('click',()=>{ mask.classList.add('show'); });
  mask.addEventListener('click',e=>{ if(e.target===mask) mask.classList.remove('show'); });
  document.getElementById('exitNo').addEventListener('click',()=>{ mask.classList.remove('show'); });
  /* v38.8 在星夜小筑 iframe 内时：通知父页掀掉游戏层（返回大页）；独立打开时兜底跳回 */
  document.getElementById('exitYes').addEventListener('click',()=>{
    try{ if(window.parent&&window.parent!==window){ window.parent.postMessage({type:'smExit'},'*'); return; } }catch(e){}
    location.href='chatnest-v38.html';
  });
})();
</script>
