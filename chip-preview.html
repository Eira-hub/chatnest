<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>行动行底色候选 · 第二轮</title>
<style>
:root{
  --bg0:#EEF1F7;--text:#16181D;
  --sans:-apple-system,system-ui,'PingFang SC','HarmonyOS Sans SC',sans-serif;
}
body{margin:0;min-height:100vh;background:
  radial-gradient(120% 90% at 78% -10%,#1A2344 0%,transparent 55%),
  linear-gradient(180deg,#F3F5FA,var(--bg0));
  font-family:var(--sans);color:var(--text);display:flex;flex-direction:column;gap:26px;align-items:center;padding:34px 16px}
h1{font-size:15px;font-weight:600;opacity:.8}
.row{display:flex;flex-direction:column;gap:8px;align-items:center;width:100%}
.tag{font-size:12px;opacity:.55;letter-spacing:.5px}
.chip{display:block;width:fit-content;max-width:78%;padding:3px 12px;border:1px solid rgba(30,40,80,.16);border-radius:999px;
  text-align:center;font-size:11.5px;line-height:1.5;letter-spacing:.2px}
/* 全部配 B 中性灰线，只变底色 */
.f .chip{background:rgba(124,139,201,.11)}   /* F 现行雾蓝 */
.g .chip{background:rgba(124,139,201,.06)}   /* G 极淡蓝 */
.h .chip{background:rgba(30,40,80,.035)}     /* H 近无底冷灰 */
.i .chip{background:rgba(255,255,255,.55)}   /* I 月白 */
.j .chip{background:rgba(242,237,231,.55)}   /* J 奶油微底 */
.k .chip{background:rgba(110,150,175,.10)}   /* K 星青 */
</style>
</head>
<body>
<h1>行动行底色候选 · 灰线已定 · 回字母即可</h1>
<div class="row f"><span class="tag">F · 现行雾蓝</span><span class="chip">他看了你的 github</span></div>
<div class="row g"><span class="tag">G · 极淡蓝</span><span class="chip">他看了你的 github</span></div>
<div class="row h"><span class="tag">H · 近无底冷灰</span><span class="chip">他看了你的 github</span></div>
<div class="row i"><span class="tag">I · 月白</span><span class="chip">他看了你的 github</span></div>
<div class="row j"><span class="tag">J · 奶油微底</span><span class="chip">他看了你的 github</span></div>
<div class="row k"><span class="tag">K · 星青</span><span class="chip">他看了你的 github</span></div>
</body>
</html>
