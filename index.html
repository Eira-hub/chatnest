<script>
/* v45.17 入口不再写死版本：先问 version.json 现在最新是哪个文件，再跳过去。
   GitHub Pages 的 HTML 固定缓存 10 分钟，只靠 meta refresh 写死文件名的话，
   改版后用户要等缓存过期才看得到；这里每次带上时间戳取一次（小文件），
   即使本页是旧缓存，也能被带到最新那一版。失败就退回写死的地址。 */
(function(){
  var FB='chatnest-v45.32.html?v=258';
  function go(u){ try{ location.replace(u); }catch(e){ location.href=u; } }
  var done=false;
  function once(u){ if(done) return; done=true; go(u); }
  setTimeout(function(){ once(FB); }, 2500);           /* 兜底：网络慢也不干等 */
  try{
    fetch('version.json?_='+Date.now(),{cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(j && j.file) once(j.file+'?v='+(j.v||Date.now()));
        else once(FB);
      })
      .catch(function(){ once(FB); });
  }catch(e){ once(FB); }
})();
</script>
</body>
