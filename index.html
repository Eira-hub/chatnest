<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ChatNest</title>
<style>
  html,body{margin:0;height:100%;background:#0b1020;color:#8b93ad;
    font-family:-apple-system,"PingFang SC",sans-serif;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<span>进入星夜小筑…</span>
<script>
(function(){
  var FALLBACK='chatnest-v40.80.html?v=197';
  function go(u){ try{ location.replace(u); }catch(e){ location.href=u; } }
  // 每次都向服务器要最新版本号（加时间戳绕过 CDN/浏览器缓存）
  fetch('version.json?t='+Date.now(), {cache:'no-store'})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){
      if(d && d.file){ go(d.file + '?v=' + (d.v||Date.now())); }
      else { go(FALLBACK); }
    })
    .catch(function(){ go(FALLBACK); });
  // 兜底：1.5 秒内没跳走就直连当前版本
  setTimeout(function(){ if(!/chatnest-v\d/.test(location.pathname)) go(FALLBACK); }, 1500);
})();
</script>
</body>
</html>
