<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>键盘测试</title>
<style>
body{margin:0;padding:20px;background:#1a1a1a;color:#fff;font-family:system-ui}
h3{margin:0 0 8px}
p{margin:0 0 16px;color:#aaa;font-size:14px}
textarea{width:100%;height:100px;font-size:16px;padding:12px;border:1px solid #555;border-radius:8px;background:#2a2a2a;color:#fff;resize:none}
#log{position:fixed;top:10px;left:10px;right:10px;background:rgba(0,0,0,.85);color:#0f0;font:12px/1.6 monospace;padding:8px;border-radius:6px;z-index:9999;pointer-events:none;white-space:pre-line}
.info{margin-top:80px;color:#666;font-size:13px}
</style>
</head>
<body>
<div id="log"></div>
<h3>键盘测试</h3>
<p>点下面的输入框，看键盘能不能弹住不缩回去。</p>
<textarea id="ta" placeholder="点这里打字..."></textarea>
<div class="info">这个页面只有一个输入框，没有任何其他代码。如果键盘也弹不住，就是手机浏览器的问题，不是我们的页面。</div>
<script>
var log=document.getElementById('log'),lines=[],baseH=window.innerHeight;
function a(m){var t=new Date(),ts=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')+':'+String(t.getSeconds()).padStart(2,'0')+'.'+String(t.getMilliseconds()).padStart(3,'0');lines.push(ts+' '+m);if(lines.length>8)lines.shift();log.textContent=lines.join('\n');}
a('boot h='+baseH);
window.addEventListener('resize',function(){a('winR h='+window.innerHeight);});
if(window.visualViewport){window.visualViewport.addEventListener('resize',function(){a('vvR h='+Math.round(window.visualViewport.height));});}
var ta=document.getElementById('ta');
ta.addEventListener('focus',function(){a('focus!');});
ta.addEventListener('blur',function(){a('blur!');});
</script>
</body>
</html>
