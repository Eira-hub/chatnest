<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0F20">
<title>ChatNest · 星夜小筑</title>
<style>
:root{
  --bg0:#070B18;--bg1:#0D1226;--bg2:#131A33;
  --panel:rgba(18,24,48,.78);--panel2:rgba(255,255,255,.05);--panel3:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
  --text:#E9EBF4;--text2:#9BA1B8;--text3:#626A85;
  --accent:#A5B9DC;--accent2:#CBD8EF;--moon:#E3C89E;--danger:#D97A7A;
  --user-b1:#2B3552;--user-b2:#212A44;--ai-b:rgba(255,255,255,.055);
  --r-bubble:18px;--r-panel:16px;--r-full:999px;
  --sans:-apple-system,system-ui,'PingFang SC','HarmonyOS Sans SC',sans-serif;
  --serif:Georgia,'Songti SC','STSong','Noto Serif SC',serif;
  --shadow:0 8px 28px rgba(0,0,0,.38);
  --ease:cubic-bezier(.22,.8,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100dvh;overflow:hidden;background:var(--bg0)}
body{font-family:var(--sans);color:var(--text);font-size:16px;line-height:1.7}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input,textarea{font-family:inherit;color:inherit;border:none;outline:none;background:none}
.hidden{display:none!important}
svg{display:block}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:4px}

/* ───────── 星空 ───────── */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(120% 90% at 78% -10%,#1A2344 0%,transparent 55%),
             radial-gradient(90% 70% at 12% 108%,#141C38 0%,transparent 52%),
             linear-gradient(180deg,var(--bg1),var(--bg0))}
.stars,.stars::after{position:absolute;inset:0}
.stars{background-image:
  radial-gradient(1.5px 1.5px at 12% 18%,rgba(255,255,255,.75) 50%,transparent 51%),
  radial-gradient(1px 1px at 28% 64%,rgba(255,255,255,.45) 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 44% 32%,rgba(255,255,255,.6) 50%,transparent 51%),
  radial-gradient(1px 1px at 58% 78%,rgba(255,255,255,.4) 50%,transparent 51%),
  radial-gradient(2px 2px at 71% 22%,rgba(255,255,255,.7) 50%,transparent 51%),
  radial-gradient(1px 1px at 83% 55%,rgba(255,255,255,.5) 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 91% 84%,rgba(255,255,255,.55) 50%,transparent 51%),
  radial-gradient(1px 1px at 8% 86%,rgba(255,255,255,.42) 50%,transparent 51%),
  radial-gradient(1.2px 1.2px at 36% 92%,rgba(255,255,255,.45) 50%,transparent 51%),
  radial-gradient(1px 1px at 64% 8%,rgba(255,255,255,.5) 50%,transparent 51%),
  radial-gradient(1.3px 1.3px at 20% 42%,rgba(227,200,158,.6) 50%,transparent 51%),
  radial-gradient(1px 1px at 77% 68%,rgba(227,200,158,.5) 50%,transparent 51%);
  animation:twinkle 7s ease-in-out infinite alternate}
.stars::after{background-image:
  radial-gradient(1px 1px at 15% 30%,rgba(255,255,255,.35) 50%,transparent 51%),
  radial-gradient(1.4px 1.4px at 52% 14%,rgba(255,255,255,.4) 50%,transparent 51%),
  radial-gradient(1px 1px at 68% 45%,rgba(255,255,255,.3) 50%,transparent 51%),
  radial-gradient(1.6px 1.6px at 87% 32%,rgba(255,255,255,.45) 50%,transparent 51%),
  radial-gradient(1px 1px at 40% 74%,rgba(255,255,255,.32) 50%,transparent 51%),
  radial-gradient(1.2px 1.2px at 95% 12%,rgba(255,255,255,.38) 50%,transparent 51%);
  animation:twinkle 9s ease-in-out infinite alternate-reverse}
@keyframes twinkle{from{opacity:.55}to{opacity:1}}

/* ───────── gate 登录门 ───────── */
#gate{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px}
.orion{width:150px;height:70px;margin-bottom:26px;opacity:.95}
.orion .belt{stroke:rgba(165,185,220,.28);stroke-width:1;stroke-dasharray:3 5}
.orion .s{fill:#DFE7F5}
.orion .s1,.orion .s3{animation:glow 3.2s ease-in-out infinite}
.orion .s2{fill:var(--moon);animation:glow 3.2s ease-in-out .8s infinite}
@keyframes glow{0%,100%{opacity:.6}50%{opacity:1}}
.gate-title{font-family:var(--serif);font-size:30px;letter-spacing:.12em;font-weight:500}
.gate-sub{margin-top:10px;font-size:13px;color:var(--text2);letter-spacing:.28em}
.gate-form{margin-top:44px;width:min(320px,84vw);display:flex;flex-direction:column;gap:14px}
.gate-input{height:48px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);
  padding:0 18px;font-size:15px;text-align:center;letter-spacing:.2em;transition:border-color .2s}
.gate-input:focus{border-color:rgba(165,185,220,.5)}
.gate-input::placeholder{color:var(--text3);letter-spacing:.2em}
.gate-btn{height:48px;border-radius:14px;background:linear-gradient(135deg,#3A4769,#2B3450);
  border:1px solid rgba(165,185,220,.28);color:var(--accent2);font-size:15px;letter-spacing:.3em;text-indent:.3em;
  transition:transform .15s var(--ease),filter .2s}
.gate-btn:active{transform:scale(.97)}
.gate-error{height:18px;margin-top:2px;font-size:12px;color:var(--danger);text-align:center;opacity:0;transition:opacity .25s}
.gate-error.on{opacity:1}

/* ───────── 主框架 ───────── */
#app{position:fixed;inset:0;z-index:1;display:flex;height:100dvh;overflow:hidden}
#main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;z-index:1}

/* ───────── 侧栏 ───────── */
#sidebar{width:min(78vw,300px);flex-shrink:0;background:var(--panel);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:3}
.sb-head{padding:calc(env(safe-area-inset-top) + 18px) 16px 12px}
.sb-brand{display:flex;align-items:center;gap:8px;padding:0 4px 14px}
.sb-brand .dot{width:7px;height:7px;border-radius:50%;background:var(--moon);box-shadow:0 0 8px rgba(227,200,158,.8)}
.sb-brand span{font-family:var(--serif);font-size:15px;letter-spacing:.14em;color:var(--text2)}
.btn-new{width:100%;height:44px;border-radius:13px;background:var(--panel3);border:1px solid rgba(165,185,220,.22);
  color:var(--accent2);font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .15s var(--ease),background .2s}
.btn-new:active{transform:scale(.97);background:rgba(255,255,255,.11)}
#sbList{flex:1;overflow-y:auto;padding:6px 10px 10px;min-height:0}
.sb-date{padding:12px 8px 4px;font-size:11px;color:var(--text3);letter-spacing:.18em}
.sb-item{position:relative;border-radius:12px;padding:10px 12px;margin-bottom:2px;display:flex;align-items:center;gap:8px;
  cursor:pointer;transition:background .15s}
.sb-item:active{background:var(--panel2)}
.sb-item.on{background:var(--panel3)}
.sb-item .t{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item .time{font-size:11px;color:var(--text3);flex-shrink:0}
.sb-item .starred{color:var(--moon);flex-shrink:0}
.sb-item .ops{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:none;gap:2px;
  background:linear-gradient(90deg,transparent,rgba(18,24,48,.95) 22%);padding-left:18px}
.sb-item .ops button{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--text2)}
.sb-item .ops button:active{background:rgba(255,255,255,.1)}
.sb-item .ops .del:active{color:var(--danger)}
.sb-item:hover .ops,.sb-item.on .ops{display:flex}
.sb-item:active .ops{display:flex}
.sb-foot{padding:10px 16px calc(env(safe-area-inset-bottom) + 14px);border-top:1px solid var(--line);display:flex;gap:8px}
.sb-foot button{flex:1;height:38px;border-radius:11px;font-size:13px;color:var(--text2);display:flex;align-items:center;justify-content:center;gap:6px}
.sb-foot button:active{background:var(--panel2);color:var(--text)}
#scrim{position:fixed;inset:0;z-index:2;background:rgba(4,7,16,.55);opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.on{opacity:1;pointer-events:auto}

/* ───────── 顶栏 ───────── */
#topbar{flex-shrink:0;height:calc(env(safe-area-inset-top) + 54px);padding:env(safe-area-inset-top) 12px 0;
  display:flex;align-items:center;gap:6px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  background:rgba(10,15,32,.6);border-bottom:1px solid var(--line);z-index:2}
.tb-btn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--text2);
  transition:background .15s,color .15s;flex-shrink:0}
.tb-btn:active{background:var(--panel3);color:var(--text)}
#btnModel{height:36px;padding:0 14px;border-radius:var(--r-full);border:1px solid var(--line);display:flex;align-items:center;gap:6px;
  font-size:13px;color:var(--text2);max-width:46vw;flex-shrink:0}
#btnModel span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#convTitle{flex:1;min-width:0;text-align:center;font-size:14px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--serif);letter-spacing:.04em}
.tb-right{width:40px;flex-shrink:0}

/* ───────── 消息流 ───────── */
#stream{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 14px 8px;min-height:0;scroll-behavior:auto}
.stream-inner{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.load-more{align-self:center;font-size:12px;color:var(--text3);padding:6px 16px;border-radius:var(--r-full);border:1px solid var(--line)}
.load-more:active{color:var(--text2)}
#splash{max-width:720px;margin:0 auto;padding:9vh 10px 20px;text-align:center}
#splash .s1{font-family:var(--serif);font-size:21px;letter-spacing:.06em;color:var(--text)}
#splash .s2{margin-top:12px;font-size:13px;color:var(--text2);line-height:2}
#splash .orb{width:46px;height:46px;margin:0 auto 20px;border-radius:50%;
  background:radial-gradient(circle at 34% 32%,#F3E7CD,#D9BC8C 58%,#A98F63);
  box-shadow:0 0 26px rgba(227,200,158,.35),0 0 60px rgba(227,200,158,.12)}

.msg{display:flex;gap:9px;max-width:100%;animation:rise .3s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.msg.user{flex-direction:row-reverse}
.avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;margin-top:2px;overflow:hidden;
  background:radial-gradient(circle at 36% 32%,#F3E7CD,#C7A878 62%,#8F7448);display:flex;align-items:center;justify-content:center}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar svg{width:16px;height:16px;color:rgba(10,14,30,.75)}
.msg.user .avatar{display:none}
.bubble{max-width:calc(100% - 42px);padding:10px 15px;border-radius:var(--r-bubble);font-size:15.5px;word-break:break-word;overflow-wrap:anywhere}
.msg.user{margin-left:auto}
.msg.user .bubble{background:linear-gradient(135deg,var(--user-b1),var(--user-b2));border-top-right-radius:5px;box-shadow:0 2px 10px rgba(0,0,0,.22)}
.msg.ai .bubble{background:var(--ai-b);border:1px solid var(--line);border-top-left-radius:5px}
.bubble .body a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.bubble .body h1,.bubble .body h2,.bubble .body h3{font-family:var(--serif);font-weight:500;margin:10px 0 4px;font-size:16.5px}
.bubble .body p{margin:0}
.bubble .body code{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:.88em;background:rgba(255,255,255,.09);padding:1px 6px;border-radius:6px}
.pre{background:rgba(4,7,16,.65);border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden}
.pre .lang{font-size:11px;color:var(--text3);padding:6px 12px 0;letter-spacing:.12em}
.pre code{display:block;padding:10px 12px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:13px;line-height:1.6;overflow-x:auto;white-space:pre}
.think{margin-bottom:8px;border-left:2px solid rgba(165,185,220,.3);padding-left:10px}
.think summary{font-size:12px;color:var(--text3);cursor:pointer;letter-spacing:.08em;list-style:none}
.think summary::-webkit-details-marker{display:none}
.think .tk-body{font-size:13px;color:var(--text2);margin-top:6px;white-space:pre-wrap;max-height:180px;overflow-y:auto}
.typing{display:inline-flex;gap:4px;align-items:center;height:20px}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--text3);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.msg-err{margin-top:6px;font-size:13px;color:var(--danger)}

/* ───────── composer ───────── */
.composer{flex-shrink:0;padding:8px 12px calc(env(safe-area-inset-bottom) + 10px);position:relative;z-index:2}
.composer-inner{max-width:720px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;
  background:var(--panel);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border:1px solid var(--line2);border-radius:26px;padding:7px 7px 7px 10px;box-shadow:var(--shadow);transition:border-color .2s}
.composer-inner:focus-within{border-color:rgba(165,185,220,.42)}
.c-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text2);
  flex-shrink:0;transition:color .2s,background .2s,transform .15s var(--ease)}
.c-btn:active{transform:scale(.9)}
.c-btn.mic-on{color:#fff;background:linear-gradient(135deg,#D97A7A,#B85858);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,122,122,.45)}55%{box-shadow:0 0 0 9px rgba(217,122,122,0)}}
#input{flex:1;min-width:0;resize:none;font-size:15.5px;line-height:1.55;max-height:132px;padding:8px 2px;background:none}
#input::placeholder{color:var(--text3)}
.btn-send{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#3D4A70,#2C3654);color:var(--accent2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s var(--ease),opacity .2s}
.btn-send:active{transform:scale(.88)}
.btn-send:disabled{opacity:.32}
.btn-send.stop{background:linear-gradient(135deg,#D97A7A,#B85858);color:#fff}
.mic-hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 76px);transform:translateX(-50%);
  font-size:12px;color:var(--text2);background:rgba(18,24,48,.92);border:1px solid var(--line);border-radius:var(--r-full);
  padding:7px 16px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s}
.mic-hint.on{opacity:1}

/* ───────── sheets ───────── */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#111731;border:1px solid var(--line);border-bottom:none;
  border-radius:22px 22px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);
  transform:translateY(105%);transition:transform .32s var(--ease);max-height:72vh;overflow-y:auto}
.sheet.on{transform:none}
.sheet .grip{width:38px;height:4px;border-radius:4px;background:rgba(255,255,255,.16);margin:4px auto 14px}
.sheet h3{font-family:var(--serif);font-size:15px;font-weight:500;letter-spacing:.1em;color:var(--text2);margin-bottom:12px;text-align:center}
.m-item{width:100%;display:flex;flex-direction:column;gap:2px;text-align:left;padding:13px 14px;border-radius:13px;margin-bottom:6px;border:1px solid transparent;transition:background .15s}
.m-item:active,.m-item.on{background:var(--panel3);border-color:rgba(165,185,220,.2)}
.m-item .mt{font-size:14.5px}
.m-item.on .mt{color:var(--accent2)}
.m-item .md{font-size:12px;color:var(--text3)}
.set-block{margin-bottom:16px}
.set-label{font-size:12px;color:var(--text3);letter-spacing:.15em;margin-bottom:8px}
.set-area{width:100%;min-height:150px;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:12px;
  font-size:13.5px;line-height:1.7;resize:vertical;color:var(--text2)}
.set-btn{width:100%;height:42px;border-radius:12px;background:var(--panel3);border:1px solid rgba(165,185,220,.22);color:var(--accent2);font-size:14px}
.set-btn:active{transform:scale(.98)}
.set-btn.warn{color:var(--danger);border-color:rgba(217,122,122,.25);margin-top:12px}

/* ───────── toast ───────── */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 66px);transform:translate(-50%,-8px);z-index:9;
  background:rgba(18,24,48,.94);border:1px solid var(--line2);color:var(--text);font-size:13px;
  padding:9px 18px;border-radius:var(--r-full);opacity:0;pointer-events:none;transition:all .28s var(--ease);max-width:80vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* 桌面宽屏 */
@media (min-width:820px){
  #sidebar{position:relative;left:0!important;transform:none!important;box-shadow:none}
  #scrim{display:none}
  #btnMenu{display:none}
  .sb-item .ops{display:none}
  .sb-item:hover .ops{display:flex}
}
/* 移动端侧栏抽屉 */
@media (max-width:819px){
  #sidebar{position:fixed;top:0;bottom:0;left:0;transform:translateX(-102%);transition:transform .3s var(--ease)}
  #sidebar.open{transform:none;box-shadow:24px 0 60px rgba(0,0,0,.45)}
}
</style>
</head>
<body>
<div class="sky"><div class="stars"></div></div>

<!-- 登录门 -->
<section id="gate" class="hidden">
  <svg class="orion" viewBox="0 0 150 70">
    <line class="belt" x1="52" y1="34" x2="98" y2="46"/>
    <circle class="s s1" cx="46" cy="18" r="3"/>
    <circle class="s s2" cx="75" cy="40" r="3.6"/>
    <circle class="s s3" cx="104" cy="52" r="3"/>
    <circle class="s" cx="30" cy="52" r="1.6" opacity=".5"/>
    <circle class="s" cx="120" cy="22" r="1.6" opacity=".5"/>
  </svg>
  <h1 class="gate-title">ChatNest</h1>
  <p class="gate-sub">星夜小筑</p>
  <form class="gate-form" id="gateForm">
    <input class="gate-input" id="gateInput" type="password" placeholder="访问密码" autocomplete="current-password">
    <button class="gate-btn" id="gateBtn" type="submit">进 入</button>
    <div class="gate-error" id="gateError"></div>
  </form>
</section>

<!-- 主界面 -->
<div id="app" class="hidden">
  <aside id="sidebar">
    <div class="sb-head">
      <div class="sb-brand"><i class="dot"></i><span>星夜小筑</span></div>
      <button class="btn-new" id="btnNew">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        新对话
      </button>
    </div>
    <div id="sbList"></div>
    <div class="sb-foot">
      <button id="btnSettings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        设置
      </button>
    </div>
  </aside>
  <div id="scrim"></div>

  <main id="main">
    <header id="topbar">
      <button class="tb-btn" id="btnMenu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <button id="btnModel"><span id="modelLabel">…</span>

<div id="toast"></div>
<script>
'use strict';
/* ═══════════ ChatNest v13 · 星夜小筑 ═══════════ */
const ENDPOINT = 'https://chatnest-fgkngqpobv.cn-hangzhou.fcapp.run';
const LS = {token:'cn_token', model:'cn_model', conv:'cn_conv'};
const $ = id => document.getElementById(id);
const state = {
  token: localStorage.getItem(LS.token) || '',
  convId: localStorage.getItem(LS.conv) || '',
  model: localStorage.getItem(LS.model) || '',
  models: [], sessions: [], avatars: {me:'', ai:''},
  streaming: false, abortCtl: null, splash: '',
  rec: null, recActive: false, recBase: '', recFinal: ''
};

function toast(msg, ms){
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.classList.remove('on'), ms||2400);
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function relTime(iso){
  if(!iso) return '';
  const d = new Date(iso); if(isNaN(d)) return '';
  const diff = (Date.now()-d.getTime())/1000;
  if(diff < 60) return '刚刚';
  if(diff < 3600) return Math.floor(diff/60)+'分钟';
  if(diff < 86400) return Math.floor(diff/3600)+'小时';
  if(diff < 604800) return Math.floor(diff/86400)+'天';
  return (d.getMonth()+1)+'/'+d.getDate();
}
async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if(state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const res = await fetch(ENDPOINT + path, {
    method: opts.method||'GET', headers, body: opts.body ? JSON.stringify(opts.body) : undefined,
    signal: opts.signal
  });
  if(res.status === 401){ logout(); throw new Error('未登录'); }
  if(!res.ok){
    let msg = '请求失败 '+res.status;
    try{ const j = await res.json(); if(j.detail) msg = j.detail; }catch(e){}
    throw new Error(msg);
  }
  return res.json();
}
/* ───────── 登录门 ───────── */
function showGate(){ $('gate').classList.remove('hidden'); $('app').classList.add('hidden'); }
function showApp(){ $('gate').classList.add('hidden'); $('app').classList.remove('hidden'); }
function logout(){ localStorage.removeItem(LS.token); state.token=''; state.convId=''; localStorage.removeItem(LS.conv); stopRec(); showGate(); }

$('gateForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const pwd = $('gateInput').value;
  const err = $('gateError'); err.classList.remove('on');
  if(!pwd){ err.textContent='输入密码才能进屋'; err.classList.add('on'); return; }
  $('gateBtn').textContent = '…'; $('gateBtn').disabled = true;
  try{
    const r = await fetch(ENDPOINT+'/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pwd})});
    if(!r.ok){ throw new Error(r.status===401 ? '密码不对，再想想' : '服务打盹了 '+r.status); }
    const j = await r.json();
    state.token = j.token; localStorage.setItem(LS.token, j.token);
    $('gateInput').value='';
    showApp(); boot();
  }catch(ex){
    err.textContent = ex.message || '连不上服务器'; err.classList.add('on');
  }finally{
    $('gateBtn').textContent = '进 入'; $('gateBtn').disabled = false;
  }
});

/* ───────── 启动 ───────── */
async function boot(){
  try{
    const [m, av] = await Promise.all([ api('/api/models'), api('/api/avatars').catch(()=>({me:{url:''},ai:{url:''}})) ]);
    state.models = m.models || [];
    state.avatars = av || {me:{url:''}, ai:{url:''}};
    if(!state.model || !state.models.find(x=>x.id===state.model)){
      const p = state.models.find(x=>x.primary) || state.models[0];
      state.model = p ? p.id : '';
    }
    renderModelLabel();
    try{ const s = await api('/api/splash'); state.splash = s.line||''; }catch(e){}
    await loadSessions();
    if(state.convId && state.sessions.find(s=>s.conv_id===state.convId)){
      await openConv(state.convId, {silent:true});
    }else{
      newConv();
    }
  }catch(e){
    toast(e.message||'启动失败');
  }
}

/* ───────── 会话 ───────── */
async function loadSessions(){
  try{
    const r = await api('/api/sessions');
    state.sessions = r.sessions || [];
    renderSidebar();
  }catch(e){ /* 静默 */ }
}
function renderSidebar(){
  const box = $('sbList'); box.innerHTML = '';
  const list = state.sessions.slice();
  list.sort((a,b)=> (b.starred?1:0)-(a.starred?1:0) || String(b.updated_at||'').localeCompare(String(a.updated_at||'')));
  if(!list.length){
    box.innerHTML = '<div class="sb-date" style="padding:18px 8px">还没有对话，点上面「新对话」开始</div>';
    return;
  }
  for(const s of list){
    const el = document.createElement('div');
    el.className = 'sb-item' + (s.conv_id===state.convId ? ' on':'');
    el.innerHTML =
      (s.starred ? '<svg class="starred" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.2 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg>' : '') +
      '<span class="t">'+esc(s.title||'新对话')+'</span>' +
      '<span class="time">'+esc(relTime(s.updated_at))+'</span>' +
      '<span class="ops">' +
        '<button class="ren" aria-label="重命名"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg></button>' +
        '<button class="del" aria-label="删除"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>' +
      '</span>';
    el.addEventListener('click', e=>{
      if(e.target.closest('.ops')) return;
      openConv(s.conv_id); closeSidebar();
    });
    el.querySelector('.ren').addEventListener('click', async ()=>{
      const t = prompt('重命名这段对话', s.title||'');
      if(t===null) return;
      try{ await api('/api/sessions/'+s.conv_id+'/title',{method:'PATCH',body:{title:t}}); s.title = t.trim()||'新对话'; renderSidebar(); if(s.conv_id===state.convId) $('convTitle').textContent = s.title; }catch(e){ toast(e.message); }
    });
    el.querySelector('.del').addEventListener('click', async e=>{
      e.stopPropagation();
      if(!confirm('删除「'+(s.title||'新对话')+'」？聊天记录会一起删掉')) return;
      try{
        await api('/api/sessions/'+s.conv_id,{method:'DELETE'});
        state.sessions = state.sessions.filter(x=>x.conv_id!==s.conv_id);
        if(s.conv_id===state.convId) newConv();
        renderSidebar();
        toast('已删除');
      }catch(ex){ toast(ex.message); }
    });
    box.appendChild(el);
  }
}
function newConv(){
  state.convId = '';
  localStorage.removeItem(LS.conv);
  $('convTitle').textContent = '';
  $('streamInner').innerHTML = '';
  const sp = $('splash');
  sp.classList.remove('hidden');
  $('splashLine').textContent = state.splash || '今晚月色不错';
  renderSidebar();
}
async function openConv(id, opt){
  opt = opt||{};
  state.convId = id;
  localStorage.setItem(LS.conv, id);
  const s = state.sessions.find(x=>x.conv_id===id);
  $('convTitle').textContent = s ? (s.title||'新对话') : '新对话';
  $('splash').classList.add('hidden');
  const inner = $('streamInner');
  inner.innerHTML = '';
  if(!opt.silent) renderSidebar();
  try{
    const r = await api('/api/sessions/'+id+'/messages?limit=40');
    const msgs = r.messages || [];
    if(r.has_more){
      const btn = document.createElement('button');
      btn.className = 'load-more'; btn.textContent = '查看更早';
      btn.addEventListener('click', ()=> loadEarlier(btn, id, r.next_before_id));
      inner.appendChild(btn);
    }
    for(const m of msgs) inner.appendChild(bubbleEl(m));
    scrollToBottom(true);
  }catch(e){
    toast(e.message||'历史加载失败');
  }
}
async function loadEarlier(btn, id, before){
  btn.textContent = '…';
  try{
    const r = await api('/api/sessions/'+id+'/messages?limit=40&before_id='+before);
    const inner = $('streamInner');
    const keep = document.createElement('div');
    inner.insertBefore(keep, btn);
    const frag = document.createDocumentFragment();
    for(const m of (r.messages||[])) frag.appendChild(bubbleEl(m));
    inner.insertBefore(frag, btn);
    keep.style.height = keep.previousElementSibling ? '0' : '0';
    if(!r.has_more){ btn.remove(); } else { btn.textContent='查看更早'; btn.dataset.before = r.next_before_id||''; btn.onclick=()=>loadEarlier(btn,id,r.next_before_id); }
  }catch(e){ btn.textContent='查看更早'; toast(e.message); }
}

/* ───────── 渲染消息 ───────── */
function md(src){
  let out = '';
  const parts = String(src).split(/```/);
  parts.forEach((p, i)=>{
    if(i % 2){
      const nl = p.indexOf('\n');
      const lang = nl > 0 ? p.slice(0, nl).trim() : '';
      const code = nl > 0 ? p.slice(nl+1) : p;
      out += '<div class="pre"><div class="lang">'+esc(lang||'code')+'</div><code>'+esc(code)+'</code></div>';
    }else{
      out += mdInline(p);
    }
  });
  return out;
}
function mdInline(p){
  const lines = String(p).split('\n');
  let html = '';
  let inList = false;
  for(const raw of lines){
    let line = esc(raw);
    line = line.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
               .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
               .replace(/`([^`\n]+)`/g,'<code>$1</code>')
               .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    const h = line.match(/^(#{1,3})\s+(.*)/);
    if(h){ if(inList){html+='</div>';inList=false;} html += '<h'+(h[1].length+1)+'>'+h[2]+'</h'+(h[1].length+1)+'>'; continue; }
    const li = line.match(/^\s*[-•]\s+(.*)/);
    if(li){ if(!inList){html+='<div style="padding-left:4px">';inList=true;} html += '<div>· '+li[1]+'</div>'; continue; }
    if(inList){ html += '</div>'; inList = false; }
    html += line ? '<p>'+line+'</p>' : '<p style="height:6px"></p>';
  }
  if(inList) html += '</div>';
  return html;
}
function bubbleEl(m){
  const isUser = m.role === 'user';
  const el = document.createElement('div');
  el.className = 'msg ' + (isUser ? 'user':'ai');
  el.dataset.mid = m.id || '';
  let inner = '';
  if(!isUser && m.thinking){
    inner += '<details class="think"><summary>他想了想 ▾</summary><div class="tk-body">'+esc(m.thinking)+'</div></details>';
  }
  inner += '<div class="body">'+md(m.text||'')+'</div>';
  el.innerHTML = '<div class="avatar">'+avatarSvg()+'</div><div class="bubble">'+inner+'</div>';
  return el;
}
function avatarSvg(){
  if(state.avatars && state.avatars.ai && state.avatars.ai.url){
    return '<img src="'+state.avatars.ai.url+'" alt="">';
  }
  return '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
}
let stickBottom = true;
$('stream').addEventListener('scroll', ()=>{
  const st = $('stream');
  stickBottom = st.scrollHeight - st.scrollTop - st.clientHeight < 90;
});
function scrollToBottom(force){
  const st = $('stream');
  if(force) stickBottom = true;
  if(stickBottom) st.scrollTop = st.scrollHeight;
}
/* ───────── 发送 · SSE 流 ───────── */
function setSendState(){
  const b = $('btnSend');
  if(state.streaming){ b.classList.add('stop'); b.disabled=false; $('sendIcon').classList.add('hidden'); $('stopIcon').classList.remove('hidden'); }
  else{ b.classList.remove('stop'); $('sendIcon').classList.remove('hidden'); $('stopIcon').classList.add('hidden'); b.disabled = !$('input').value.trim(); }
}
function autoGrow(){
  const i = $('input');
  i.style.height = 'auto';
  i.style.height = Math.min(i.scrollHeight, 132) + 'px';
  $('btnSend').disabled = state.streaming ? false : !i.value.trim();
}
$('input').addEventListener('input', autoGrow);
$('input').addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey && window.matchMedia('(min-width:820px)').matches){
    e.preventDefault(); send();
  }
});
$('btnSend').addEventListener('click', ()=>{
  if(state.streaming){ if(state.abortCtl) state.abortCtl.abort(); return; }
  send();
});

async function send(){
  const text = $('input').value.trim();
  if(!text || state.streaming) return;
  $('splash').classList.add('hidden');
  const inner = $('streamInner');
  const um = document.createElement('div');
  um.className = 'msg user';
  um.innerHTML = '<div class="bubble"><div class="body">'+md(text)+'</div></div>';
  inner.appendChild(um);
  $('input').value=''; autoGrow(); scrollToBottom(true);

  const ab = document.createElement('div');
  ab.className = 'msg ai';
  ab.innerHTML = '<div class="avatar">'+avatarSvg()+'</div><div class="bubble"><div class="typing"><i></i><i></i><i></i></div><div class="body" style="display:none"></div></div>';
  inner.appendChild(ab); scrollToBottom(true);

  state.streaming = true; setSendState();
  state.abortCtl = new AbortController();
  let tBuf = '', xBuf = '', had = false, err = null;
  const bodyEl = ab.querySelector('.body');
  const thinkEl = ()=>{ let d = ab.querySelector('.think'); if(!d){ d=document.createElement('details'); d.className='think'; d.innerHTML='<summary>他想了想 ▾</summary><div class="tk-body"></div>'; ab.querySelector('.bubble').insertBefore(d, bodyEl);} return d; };
  try{
    const res = await fetch(ENDPOINT+'/api/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.token},
      body: JSON.stringify({ message:text, conversation_id: state.convId||null, model: state.model||null, extended:true }),
      signal: state.abortCtl.signal
    });
    if(res.status===401){ logout(); return; }
    if(!res.ok){ let m='请求失败 '+res.status; try{const j=await res.json(); if(j.detail)m=j.detail;}catch(e){} throw new Error(m); }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      let idx;
      while((idx = buf.indexOf('\n\n')) >= 0){
        const block = buf.slice(0, idx); buf = buf.slice(idx+2);
        let ev='message', data='';
        for(const line of block.split('\n')){
          if(line.startsWith('event:')) ev = line.slice(6).trim();
          else if(line.startsWith('data:')) data += line.slice(5).trim();
        }
        if(!data) continue;
        let obj; try{ obj = JSON.parse(data); }catch(e){ continue; }
        if(ev==='conversation' && obj.conversation_id){
          state.convId = obj.conversation_id; localStorage.setItem(LS.conv, state.convId);
        }else if(ev==='thinking'){
          tBuf += obj.text||''; const d = thinkEl(); d.querySelector('.tk-body').textContent = tBuf; if(!had){ ab.querySelector('.typing').style.display='none'; bodyEl.style.display=''; } had=true; scrollToBottom();
        }else if(ev==='delta'){
          xBuf += obj.text||'';
          if(!had){ ab.querySelector('.typing').style.display='none'; bodyEl.style.display=''; had=true; }
          bodyEl.innerHTML = md(xBuf); scrollToBottom();
        }else if(ev==='error'){
          err = obj.message||'出错了';
        }
      }
    }
  }catch(e){
    if(e.name!=='AbortError') err = err || (e.message||'网络中断');
  }
  ab.querySelector('.typing') && (ab.querySelector('.typing').style.display='none');
  bodyEl.style.display='';
  if(xBuf){ bodyEl.innerHTML = md(xBuf); }
  else if(!tBuf && !had){ bodyEl.innerHTML = ''; }
  if(err){ const d = document.createElement('div'); d.className='msg-err'; d.textContent='⚠ '+err; ab.querySelector('.bubble').appendChild(d); }
  if(!xBuf && !tBuf && !err){ bodyEl.innerHTML = '<span style="color:var(--text3)">（没有收到回复）</span>'; }
  state.streaming = false; state.abortCtl = null; setSendState();
  scrollToBottom();
  loadSessions();
}

/* ───────── 语音输入 ───────── */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function micUI(on){ $('btnMic').classList.toggle('mic-on', on); $('micHint').classList.toggle('on', on); }
function stopRec(){ if(state.rec){ try{ state.rec.onend=null; state.rec.stop(); }catch(e){} } state.rec=null; state.recActive=false; micUI(false); }
$('btnMic').addEventListener('click', ()=>{
  if(state.recActive){ stopRec(); return; }
  if(!SR){ toast('这个浏览器不支持语音识别，试试 Chrome / Via / Edge'); return; }
  const rec = new SR();
  state.rec = rec; state.recFinal = ''; state.recBase = $('input').value;
  rec.lang = 'zh-CN';
  rec.continuous = true;
  rec.interimResults = true;
  rec.onresult = e=>{
    let interim = '';
    for(let i = e.resultIndex; i < e.results.length; i++){
      const r = e.results[i];
      if(r.isFinal) state.recFinal += r[0].transcript;
      else interim += r[0].transcript;
    }
    const txt = (state.recBase ? state.recBase + ' ' : '') + state.recFinal + interim;
    $('input').value = txt;
    autoGrow();
  };
  rec.onerror = e=>{
    if(e.error==='not-allowed' || e.error==='service-not-allowed') toast('麦克风权限被拒了，去浏览器设置里允许');
    else if(e.error==='no-speech') toast('没听到声音，再试一次');
    stopRec();
  };
  rec.onend = ()=>{ if(state.recActive){ micUI(false); state.recActive=false; } };
  try{ rec.start(); state.recActive = true; micUI(true); toast('开始说吧，说完点一下话筒', 1800); }
  catch(e){ toast('语音启动失败'); }
});

/* ───────── 模型 sheet ───────── */
function renderModelLabel(){
  const m = state.models.find(x=>x.id===state.model);
  $('modelLabel').textContent = m ? (m.label||m.id) : '模型';
}
function openSheet(id){ $(id).classList.add('on'); $('scrim').classList.add('on'); }
function closeSheets(){
  $('modelSheet').classList.remove('on'); $('settingsSheet').classList.remove('on');
  if(!$('sidebar').classList.contains('open')) $('scrim').classList.remove('on');
}
$('btnModel').addEventListener('click', ()=>{
  const box = $('modelList'); box.innerHTML='';
  for(const m of state.models){
    const b = document.createElement('button');
    b.className = 'm-item' + (m.id===state.model?' on':'');

    b.addEventListener('click', ()=>{
      state.model = m.id; localStorage.setItem(LS.model, m.id);

/* ───────── 设置 sheet ───────── */
$('btnSettings').addEventListener('click', async ()=>{
  closeSidebar();
  $('memoryArea').value = '加载中…';
  openSheet('settingsSheet');
  try{
    const r = await api('/api/memory-summary');
    const t = typeof r === 'string' ? r : (r.text || r.summary || (r.content || JSON.stringify(r, null, 1)));
    $('memoryArea').value = t || '';
  }catch(e){ $('memoryArea').value = ''; }
});
$('btnSaveMemory').addEventListener('click', async ()=>{
  try{
    await api('/api/memory-summary', {method:'PUT', body:{text: $('memoryArea').value}});
    toast('记忆已保存');
  }catch(e){ toast(e.message); }
});
$('btnLogout').addEventListener('click', ()=>{ closeSheets(); logout(); });

/* ───────── 侧栏 & 遮罩 ───────── */
function openSidebar(){ $('sidebar').classList.add('open'); $('scrim').classList.add('on'); }
function closeSidebar(){ $('sidebar').classList.remove('open'); if(!$('modelSheet').classList.contains('on') && !$('settingsSheet').classList.contains('on')) $('scrim').classList.remove('on'); }
$('btnMenu').addEventListener('click', openSidebar);
$('btnNew').addEventListener('click', ()=>{ newConv(); closeSidebar(); });
$('scrim').addEventListener('click', ()=>{ closeSheets(); closeSidebar(); });

/* ───────── init ───────── */
(function init(){
  if(state.token){ showApp(); boot(); }
  else{ showGate(); const gi=$('gateInput'); setTimeout(()=>{ try{gi.focus();}catch(e){} }, 300); }
})();
</script>
