<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>聊天</title>
<style>
:root{
  --bg:#EDEDED; --card:#FFFFFF; --sep:#E5E5E5;
  --t1:#000000; --t2:#8A8A8E; --t3:#C7C7CC;
  --nav1:#FBFCFE; --nav2:#E4E9F3; --navline:#D9DDE6;
  --accent:#2F51D8;
}
[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --sep:#2C2C2E;
  --t1:#FFFFFF; --t2:#8A8A8E; --t3:#5A5A5E;
  --nav1:#262C3E; --nav2:#14171F; --navline:#2C2C2E;
  --accent:#AFCBFF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}

/* 顶栏：渐变，与主应用一致 */
.nav{flex:none;position:relative;display:flex;align-items:center;justify-content:center;
  height:calc(44px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);
  background:linear-gradient(180deg,var(--nav1) 0%,var(--nav2) 60%,var(--nav2) 100%);
  border-bottom:.5px solid var(--navline);
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset}
[data-theme="dark"] .nav{box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
.nav-title{font-size:17px;font-weight:600;color:var(--t1)}
.nav-back{position:absolute;left:2px;top:env(safe-area-inset-top);width:44px;height:44px;
  border:none;background:none;padding:0;color:var(--t1);font-size:30px;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.nav-back:active{opacity:.5}
.nav-right{position:absolute;right:8px;top:env(safe-area-inset-top);height:44px;display:flex;align-items:center}
.nav-btn{width:34px;height:34px;border:none;background:none;padding:0;color:var(--t1);
  display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:8px}
.nav-btn:active{background:rgba(120,130,150,.16)}

/* 列表 */
.list{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--card)}
.item{position:relative;display:flex;align-items:center;gap:12px;
  padding:10px 16px 10px 16px;background:var(--card);cursor:pointer;border:none;width:100%;
  text-align:left;font:inherit;color:inherit}
.item:active{background:rgba(120,130,150,.10)}
.item+.item::before{content:'';position:absolute;left:66px;right:0;top:0;height:.5px;background:var(--sep)}
.av{width:42px;height:42px;border-radius:8px;object-fit:cover;flex:none;background:rgba(120,130,160,.14)}
.av-ph{width:42px;height:42px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#7C8BC9,#4A57A5);color:#fff;font-size:17px;font-weight:600;font-family:serif}
.mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row1{display:flex;align-items:baseline;gap:8px}
.ttl{flex:1;min-width:0;font-size:16px;font-weight:400;color:var(--t1);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm{flex:none;font-size:12px;color:var(--t2)}
.pre{font-size:13px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  min-height:18px}
.pre.loading{color:var(--t3)}
.pin{display:inline-block;margin-left:6px;padding:1px 5px;font-size:10px;border-radius:4px;
  background:rgba(47,81,216,.1);color:var(--accent);vertical-align:2px;flex:none}
.empty{padding:60px 24px;text-align:center;color:var(--t2);font-size:14px;line-height:2}
.skel{height:14px;border-radius:4px;background:rgba(120,130,150,.15)}
</style>
</head>
<body>

<header class="nav">
  <button class="nav-back" id="btnBack" type="button" aria-label="返回">‹</button>
  <span class="nav-title">聊天</span>
  <div class="nav-right">
    <button class="nav-btn" id="btnNew" type="button" aria-label="新对话">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
</header>

<main class="list" id="list">
  <div class="empty">载入中…</div>
</main>

<script>
(function(){
  var LSK = {token:'cn_token', theme:'cn_theme', conv:'cn_conv'};
  var API = 'https://chatnest-fgkngqpobv.cn-hangzhou.fcapp.run';
  var aiAvatar = '';

  /* 主题跟随主应用 */
  try{
    var th = localStorage.getItem(LSK.theme) || 'light';
    document.documentElement.setAttribute('data-theme', th);
  }catch(e){}

  function token(){ try{ return localStorage.getItem(LSK.token) || ''; }catch(e){ return ''; } }
  function api(path, opt){
    opt = opt || {};
    var h = {'Content-Type':'application/json'};
    var t = token(); if(t) h['Authorization'] = 'Bearer ' + t;
    return fetch(API + path, {method: opt.method || 'GET', headers: h, body: opt.body})
      .then(function(r){
        if(!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      });
  }

  function fmtTime(iso){
    if(!iso) return '';
    var d = new Date(iso); if(isNaN(d)) return '';
    var now = new Date();
    var sameDay = d.toDateString() === now.toDateString();
    if(sameDay) return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    var day = 86400000;
    var diff = (now - d) / day;
    if(diff < 2) return '昨天';
    if(diff < 7) return ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  function el(tag, cls, txt){
    var n = document.createElement(tag);
    if(cls) n.className = cls;
    if(txt !== undefined) n.textContent = txt;
    return n;
  }

  var listEl = document.getElementById('list');
  var byId = {};

  function render(items){
    listEl.innerHTML = '';
    if(!items.length){
      listEl.appendChild(el('div','empty','还没有对话\n点右上角 + 开始'));
      return;
    }
    items.forEach(function(s){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'item'; b.dataset.cid = s.conv_id;
      byId[s.conv_id] = b;

      if(aiAvatar){
        var img = document.createElement('img');
        img.className = 'av'; img.src = aiAvatar; img.alt = '';
        b.appendChild(img);
      } else {
        b.appendChild(el('div','av-ph','霁'));
      }

      var mid = el('div','mid');
      var r1 = el('div','row1');
      var ttl = el('div','ttl', s.title || '未命名对话');
      r1.appendChild(ttl);
      if(s.starred) r1.appendChild(el('span','pin','置顶'));
      r1.appendChild(el('div','tm', fmtTime(s.updated_at)));
      mid.appendChild(r1);
      var pre = el('div','pre loading','…');
      mid.appendChild(pre);
      b.appendChild(mid);

      b.addEventListener('click', function(){
        try{ localStorage.setItem(LSK.conv, s.conv_id); }catch(e){}
        location.href = './';
      });

      listEl.appendChild(b);
    });
  }

  /* 并发拉每个会话的最后一条消息，渐进填充预览 */
  function hydrate(items){
    var idx = 0, running = 0, MAX = 5;
    function next(){
      if(idx >= items.length) return;
      var s = items[idx++];
      running++;
      api('/api/sessions/' + s.conv_id + '/messages?limit=1')
        .then(function(r){
          var m = (r.messages || [])[0];
          var node = byId[s.conv_id];
          if(!node) return;
          var pre = node.querySelector('.pre');
          if(!pre) return;
          pre.classList.remove('loading');
          if(m && m.text){
            var t = String(m.text).replace(/\s+/g,' ').trim();
            pre.textContent = (m.role === 'user' ? '我：' : '') + t.slice(0, 60);
          } else {
            pre.textContent = '暂无消息';
          }
        })
        .catch(function(){
          var node = byId[s.conv_id];
          if(node){ var pre = node.querySelector('.pre'); if(pre){ pre.classList.remove('loading'); pre.textContent = ''; } }
        })
        .then(function(){
          running--;
          next();
        });
    }
    for(var i = 0; i < MAX; i++) next();
  }

  function boot(){
    if(!token()){
      listEl.innerHTML = '';
      var d = el('div','empty','还没有登录\n请先从主页面进入一次');
      listEl.appendChild(d);
      return;
    }
    Promise.all([
      api('/api/sessions'),
      api('/api/avatars').catch(function(){ return {ai:{}}; })
    ]).then(function(res){
      var sessions = (res[0] && res[0].sessions) || [];
      try{ aiAvatar = (res[1] && res[1].ai && res[1].ai.url) || ''; }catch(e){}
      sessions.sort(function(a,b){
        var sa = a.starred ? 1 : 0, sb = b.starred ? 1 : 0;
        if(sa !== sb) return sb - sa;
        return String(b.updated_at || '').localeCompare(String(a.updated_at || ''));
      });
      render(sessions);
      hydrate(sessions);
    }).catch(function(e){
      listEl.innerHTML = '';
      listEl.appendChild(el('div','empty','加载失败：' + (e.message || '网络错误')));
    });
  }

  document.getElementById('btnBack').addEventListener('click', function(){
    if(history.length > 1) history.back();
    else location.href = './';
  });
  document.getElementById('btnNew').addEventListener('click', function(){
    try{ localStorage.removeItem(LSK.conv); }catch(e){}
    location.href = './';
  });

  boot();
})();
</script>
</body>
</html>
